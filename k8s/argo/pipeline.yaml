apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: pipeline-
  namespace: argo
spec:
  serviceAccountName: argo
  imagePullSecrets:
  - name: regcred
  podGC:
    strategy: OnWorkflowCompletion
    deleteDelayDuration: 30m
  ttlStrategy:
    secondsAfterSuccess: 3600 # 1 hour
    secondsAfterFailure: 86400 # 1 day
  artifactGC:
    strategy: OnWorkflowCompletion
  arguments:
    parameters:
    - name: mode
      value: embedding-evaluation
    - name: raw_data
      value: Data_example/bert/train.csv
    - name: data_source_A
      value: Data_example/fodors_zagats-tableA.csv
    - name: data_source_B
      value: Data_example/fodors_zagats-tableB.csv
  entrypoint: main
  templates:
    - name: normalization
      inputs:
        parameters:
        - name: mode
        - name: raw_data
        - name: data_source_A
        - name: data_source_B
      container:
        name: main
        image: kevinoulai/erctl:normalization
        imagePullPolicy: IfNotPresent
        command: [sh, -c]
        args:
        - |
          /opt/venv/bin/python /app/distributions/normalization_distribution.py --mode '{{inputs.parameters.mode}}' --raw_data '{{inputs.parameters.raw_data}}' --data_source_A '{{inputs.parameters.data_source_A}}' --data_source_B '{{inputs.parameters.data_source_B}}' > /tmp/processed_data
        env:
        - name: MODE
          value: '{{inputs.parameters.mode}}'
        - name: WORKFLOW_NAME
          value: '{{workflow.name}}'
        - name: CODECARBON_REPORT_PATH
          value: /app/reports/codecarbon/{{workflow.name}}/emissions.csv
        volumeMounts:
        - name: pipeline-config
          mountPath: /app/config/examples/config-embedding.yaml
          subPath: config.yaml
        - name: normalization-distribution
          mountPath: /app/distributions/normalization_distribution.py
          subPath: normalization_distribution.py
        - name: pipeline-data
          mountPath: /app/Data_example
        - name: pipeline-buffer-data
          mountPath: /app/data/buffers
        - name: pipeline-reports
          mountPath: /app/reports
        - name: pipeline-buffer-utils
          mountPath: /app/utils/buffers.py
          subPath: buffers.py
        - name: codecarbon
          mountPath: /app/utils/codecarbon.py
          subPath: codecarbon.py
      volumes:
      - name: pipeline-config
        configMap:
          name: er-pipeline-config
      - name: normalization-distribution
        configMap:
          name: eaer-normalization-distribution
      - name: pipeline-data
        persistentVolumeClaim:
          claimName: pipeline-data-claim
      - name: pipeline-buffer-data
        persistentVolumeClaim:
          claimName: pipeline-buffer-data-claim
      - name: pipeline-reports
        persistentVolumeClaim:
          claimName: pipeline-reports-claim
      - name: pipeline-buffer-utils
        configMap:
          name: eaer-kafka-buffers
      - name: codecarbon
        configMap:
          name: eaer-codecarbon
      outputs:
        artifacts:
        - name: processed_data
          path: /tmp/processed_data

    - name: graph
      inputs:
        artifacts:
        - name: processed_data
          path: /tmp/processed_data
          optional: true
        parameters:
        - name: mode
        - name: function
      container:
        name: main
        image: kevinoulai/erctl:graph
        imagePullPolicy: Always
        command: [/opt/venv/bin/python, /app/distributions/graph_randomwalk.py]
        args:
        - --processed_data
        - /tmp/processed_data
        - --mode
        - '{{inputs.parameters.mode}}'
        - --function
        - '{{inputs.parameters.function}}'
        - --output
        - /tmp/sequences.json
        env:
        - name: WORKFLOW_NAME
          value: '{{workflow.name}}'
        - name: CODECARBON_REPORT_PATH
          value: /app/reports/codecarbon/{{workflow.name}}/emissions.csv
        volumeMounts:
        - name: pipeline-config
          mountPath: /app/config/examples/config-embedding.yaml
          subPath: config.yaml
        - name: graph-distribution
          mountPath: /app/distributions/graph_randomwalk.py
          subPath: graph_randomwalk.py
        - name: pipeline-graph-cache
          mountPath: /app/data
        - name: pipeline-buffer-data
          mountPath: /app/data/buffers
        - name: pipeline-reports
          mountPath: /app/reports
        - name: pipeline-buffer-utils
          mountPath: /app/utils/buffers.py
          subPath: buffers.py
        - name: codecarbon
          mountPath: /app/utils/codecarbon.py
          subPath: codecarbon.py
      volumes:
      - name: pipeline-config
        configMap:
          name: er-pipeline-config
      - name: graph-distribution
        configMap:
          name: eaer-graph-distribution
      - name: pipeline-graph-cache
        persistentVolumeClaim:
          claimName: pipeline-graph-cache-claim
      - name: pipeline-buffer-data
        persistentVolumeClaim:
          claimName: pipeline-buffer-data-claim
      - name: pipeline-reports
        persistentVolumeClaim:
          claimName: pipeline-reports-claim
      - name: pipeline-buffer-utils
        configMap:
          name: eaer-kafka-buffers
      - name: codecarbon
        configMap:
          name: eaer-codecarbon
      outputs:
        artifacts:
        - name: sequences
          path: /tmp/sequences.json

    - name: embedding
      inputs:
        artifacts:
        - name: sequences
          path: /tmp/sequences.json
          optional: true
        - name: candidate_pairs
          path: /tmp/candidate_pairs.json
          optional: true
        parameters:
        - name: mode
        - name: function
      container:
        name: main
        image: kevinoulai/erctl:embedding
        imagePullPolicy: IfNotPresent
        command: [/opt/venv/bin/python, /app/distributions/embedding_calculating.py]
        args:
        - --mode
        - '{{inputs.parameters.mode}}'
        - --sequences
        - /tmp/sequences.json
        - --candidate_pairs
        - /tmp/candidate_pairs.json
        - --function
        - '{{inputs.parameters.function}}'
        - --output
        - /tmp/matching_pairs.json
        env:
        - name: WORKFLOW_NAME
          value: '{{workflow.name}}'
        - name: CODECARBON_REPORT_PATH
          value: /app/reports/codecarbon/{{workflow.name}}/emissions.csv
        volumeMounts:
        - name: pipeline-config
          mountPath: /app/config/examples/config-embedding.yaml
          subPath: config.yaml
        - name: embedding-distribution
          mountPath: /app/distributions/embedding_calculating.py
          subPath: embedding_calculating.py
        - name: pipeline-embedding-model-cache
          mountPath: /app/data
        - name: pipeline-buffer-data
          mountPath: /app/data/buffers
        - name: pipeline-reports
          mountPath: /app/reports
        - name: pipeline-buffer-utils
          mountPath: /app/utils/buffers.py
          subPath: buffers.py
        - name: codecarbon
          mountPath: /app/utils/codecarbon.py
          subPath: codecarbon.py
      volumes:
      - name: pipeline-config
        configMap:
          name: er-pipeline-config
      - name: embedding-distribution
        configMap:
          name: eaer-embedding-calculating
      - name: pipeline-embedding-model-cache
        persistentVolumeClaim:
          claimName: pipeline-embedding-model-cache-claim
      - name: pipeline-buffer-data
        persistentVolumeClaim:
          claimName: pipeline-buffer-data-claim
      - name: pipeline-buffer-utils
        configMap:
          name: eaer-kafka-buffers
      - name: pipeline-reports
        persistentVolumeClaim:
          claimName: pipeline-reports-claim
      - name: codecarbon
        configMap:
          name: eaer-codecarbon
      outputs:
        artifacts:
          - name: matching_pairs
            path: /tmp/matching_pairs.json

    - name: cg-feature-extraction
      inputs:
        parameters:
        - name: mode
        artifacts:
        - name: processed_data
          path: /tmp/processed_data
          optional: true
      container:
        name: main
        image: kevinoulai/erctl:cgfeature
        imagePullPolicy: IfNotPresent
        command: [/opt/venv/bin/python, /app/distributions/cg_feature_distribution.py]
        args:
        - --mode
        - '{{inputs.parameters.mode}}'
        - --processed_data
        - /tmp/processed_data
        - --output
        - /tmp/cg_feature
        env:
        - name: WORKFLOW_NAME
          value: '{{workflow.name}}'
        - name: CODECARBON_REPORT_PATH
          value: /app/reports/codecarbon/{{workflow.name}}/emissions.csv
        volumeMounts:
        - name: pipeline-config
          mountPath: /app/config/examples/config-embedding.yaml
          subPath: config.yaml
        - name: cg-feature-distribution
          mountPath: /app/distributions/cg_feature_distribution.py
          subPath: cg_feature_distribution.py
        - name: pipeline-buffer-utils
          mountPath: /app/utils/buffers.py
          subPath: buffers.py
        - name: pipeline-buffer-data
          mountPath: /app/data/buffers
        - name: pipeline-reports
          mountPath: /app/reports
        - name: codecarbon
          mountPath: /app/utils/codecarbon.py
          subPath: codecarbon.py
      volumes:
      - name: pipeline-config
        configMap:
          name: er-pipeline-config
      - name: cg-feature-distribution
        configMap:
          name: eaer-cg-feature-distribution
      - name: pipeline-buffer-utils
        configMap:
          name: eaer-kafka-buffers
      - name: pipeline-buffer-data
        persistentVolumeClaim:
          claimName: pipeline-buffer-data-claim
      - name: pipeline-reports
        persistentVolumeClaim:
          claimName: pipeline-reports-claim
      - name: codecarbon
        configMap:
          name: eaer-codecarbon
      outputs:
        artifacts:
        - name: cg_feature
          path: /tmp/cg_feature

    - name: feature-index
      inputs:
        artifacts:
        - name: cg_feature
          path: /tmp/cg_feature
          optional: true
        parameters:
        - name: mode
        - name: function
      container:
        name: main
        image: kevinoulai/erctl:featureindex
        imagePullPolicy: IfNotPresent
        command: [/opt/venv/bin/python, /app/distributions/featureindex_candidate.py]
        args:
        - --cg_feature
        - /tmp/cg_feature
        - --mode
        - '{{inputs.parameters.mode}}'
        - --function
        - '{{inputs.parameters.function}}'
        - --output
        - /tmp/candidate_pairs.json
        env:
        - name: WORKFLOW_NAME
          value: '{{workflow.name}}'
        - name: CODECARBON_REPORT_PATH
          value: /app/reports/codecarbon/{{workflow.name}}/emissions.csv
        volumeMounts:
        - name: pipeline-config
          mountPath: /app/config/examples/config-embedding.yaml
          subPath: config.yaml
        - name: feature-index-distribution
          mountPath: /app/distributions/featureindex_candidate.py
          subPath: featureindex_candidate.py
        - name: pipeline-feature-index-cache
          mountPath: /app/data
        - name: pipeline-buffer-data
          mountPath: /app/data/buffers
        - name: pipeline-reports
          mountPath: /app/reports
        - name: pipeline-buffer-utils
          mountPath: /app/utils/buffers.py
          subPath: buffers.py
        - name: codecarbon
          mountPath: /app/utils/codecarbon.py
          subPath: codecarbon.py
      volumes:
      - name: pipeline-config
        configMap:
          name: er-pipeline-config
      - name: feature-index-distribution
        configMap:
          name: eaer-feature-index
      - name: pipeline-feature-index-cache
        persistentVolumeClaim:
          claimName: pipeline-feature-index-cache-claim
      - name: pipeline-buffer-utils
        configMap:
          name: eaer-kafka-buffers
      - name: pipeline-buffer-data
        persistentVolumeClaim:
          claimName: pipeline-buffer-data-claim
      - name: pipeline-reports
        persistentVolumeClaim:
          claimName: pipeline-reports-claim
      - name: codecarbon
        configMap:
          name: eaer-codecarbon
      outputs:
        artifacts:
        - name: candidate_pairs
          path: /tmp/candidate_pairs.json

    - name: prediction
      inputs:
        parameters:
        - name: mode
        - name: function
        artifacts:
        - name: matching_pairs
          path: /tmp/matching_pairs.json
          optional: true
      container:
        name: main
        image: kevinoulai/erctl:prediction
        imagePullPolicy: IfNotPresent
        command: [/opt/venv/bin/python, /app/distributions/decision_evaluation.py]
        args:
        - --mode
        - '{{inputs.parameters.mode}}'
        - --matching_pairs
        - '{{inputs.artifacts.matching_pairs.path}}'
        - --function
        - '{{inputs.parameters.function}}'
        - --output
        - /tmp/predicted_matching
        env:
        - name: WORKFLOW_NAME
          value: '{{workflow.name}}'
        - name: CODECARBON_REPORT_PATH
          value: /app/reports/codecarbon/{{workflow.name}}/emissions.csv
        volumeMounts:
        - name: pipeline-config
          mountPath: /app/config/examples/config-embedding.yaml
          subPath: config.yaml
        - name: decision-evaluation-distribution
          mountPath: /app/distributions/decision_evaluation.py
          subPath: decision_evaluation.py
        - name: pipeline-data
          mountPath: /app/Data_example
        - name: pipeline-embedding-model-cache
          mountPath: /app/data
        - name: pipeline-buffer-data
          mountPath: /app/data/buffers
        - name: pipeline-reports
          mountPath: /app/reports
        - name: pipeline-buffer-utils
          mountPath: /app/utils/buffers.py
          subPath: buffers.py
        - name: codecarbon
          mountPath: /app/utils/codecarbon.py
          subPath: codecarbon.py
      volumes:
      - name: pipeline-config
        configMap:
          name: er-pipeline-config
      - name: decision-evaluation-distribution
        configMap:
          name: eaer-decision-evaluation
      - name: pipeline-data
        persistentVolumeClaim:
          claimName: pipeline-data-claim
      - name: pipeline-embedding-model-cache
        persistentVolumeClaim:
          claimName: pipeline-embedding-model-cache-claim
      - name: pipeline-buffer-utils
        configMap:
          name: eaer-kafka-buffers
      - name: pipeline-buffer-data
        persistentVolumeClaim:
          claimName: pipeline-buffer-data-claim
      - name: pipeline-reports
        persistentVolumeClaim:
          claimName: pipeline-reports-claim
      - name: codecarbon
        configMap:
          name: eaer-codecarbon
      outputs:
        parameters:
        - name: predicted_matching
          valueFrom:
            path: /tmp/predicted_matching

    - name: bert
      inputs:
        artifacts:
        - name: processed_data
          path: /tmp/processed_data
        parameters:
        - name: mode
      container:
        name: main
        image: kevinoulai/erctl:bert
        imagePullPolicy: IfNotPresent
        command: [/opt/venv/bin/python, /app/distributions/bert_distribution.py]
        args:
        - --mode
        - '{{inputs.parameters.mode}}'
        - --processed_data
        - /tmp/processed_data
        - --output
        - /tmp/bert_output
        env:
        - name: WORKFLOW_NAME
          value: '{{workflow.name}}'
        - name: CODECARBON_REPORT_PATH
          value: /app/reports/codecarbon/{{workflow.name}}/emissions.csv
        volumeMounts:
        - name: pipeline-config
          mountPath: /app/config/examples/config-bert.yaml
          subPath: config.yaml
        - name: pipeline-bert-model
          mountPath: /app/data/bert
        - name: bert-distribution
          mountPath: /app/distributions/bert_distribution.py
          subPath: bert_distribution.py
        - name: bert-training
          mountPath: /app/pipeline/bert_training.py
          subPath: bert_training.py
        - name: pipeline-reports
          mountPath: /app/reports
        - name: pipeline-data
          mountPath: /app/Data_example
        - name: codecarbon
          mountPath: /app/utils/codecarbon.py
          subPath: codecarbon.py
      volumes:
      - name: pipeline-config
        configMap:
          name: er-pipeline-config
      - name: pipeline-bert-model
        persistentVolumeClaim:
          claimName: pipeline-bert-model-claim
      - name: bert-distribution
        configMap:
          name: eaer-bert-distribution
      - name: bert-training
        configMap:
          name: eaer-bert-training
      - name: pipeline-data
        persistentVolumeClaim:
          claimName: pipeline-data-claim
      - name: pipeline-reports
        persistentVolumeClaim:
          claimName: pipeline-reports-claim
      - name: codecarbon
        configMap:
          name: eaer-codecarbon
      outputs:
        parameters:
        - name: bert_output
          valueFrom:
            path: /tmp/bert_output
      
    - name: pipeline-init
      inputs:
        parameters:
        - name: fallback_mode
      container:
        name: main
        image: kevinoulai/erctl:config
        imagePullPolicy: IfNotPresent
        command: [sh, /app/init.sh]
        env:
        - name: FALLBACK_MODE
          value: '{{inputs.parameters.fallback_mode}}'
        volumeMounts:
          - name: pipeline-config
            mountPath: /app/config/examples/config-embedding.yaml
            subPath: config.yaml
          - name: pipeline-init-script
            mountPath: /app/init.sh
            subPath: init.sh
          - name: pipeline-buffer-data
            mountPath: /app/data/buffers
      volumes:
      - name: pipeline-config
        configMap:
          name: er-pipeline-config
      - name: pipeline-init-script
        configMap:
          name: eaer-pipeline-init
      - name: pipeline-buffer-data
        persistentVolumeClaim:
          claimName: pipeline-buffer-data-claim
      outputs:
        parameters:
        - name: mode
          valueFrom:
            path: /tmp/mode
        artifacts:
        - name: config
          path: /tmp/config.yaml
      
    - name: kafka-producer
      daemon: true
      container:
        name: main
        image: kevinoulai/kafka:producer
        imagePullPolicy: IfNotPresent
        command: [python, /app/producer.py]
        ports:
        - containerPort: 9092
        volumeMounts:
          - name: pipeline-kafka-producer
            mountPath: /app/producer.py
            subPath: producer.py
          - name: pipeline-config
            mountPath: /app/config/examples/config-embedding.yaml
            subPath: config.yaml
          - name: pipeline-data
            mountPath: /app/Data_example
      volumes:
      - name: pipeline-kafka-producer
        configMap:
          name: eaer-kafka-producer
      - name: pipeline-config
        configMap:
          name: er-pipeline-config
      - name: pipeline-data
        persistentVolumeClaim:
          claimName: pipeline-data-claim

    - name: kafka-consumer
      daemon: true
      serviceAccountName: argo
      container:
        name: main
        image: kevinoulai/kafka:python
        imagePullPolicy: IfNotPresent
        command: [python, /app/consumer.py]
        ports:
        - containerPort: 9092
        volumeMounts:
          - name: pipeline-kafka-consumer
            mountPath: /app/consumer.py
            subPath: consumer.py
          - name: pipeline-config
            mountPath: /app/config/examples/config-embedding.yaml
            subPath: config.yaml
          - name: pipeline-data
            mountPath: /app/Data_example
          - name: pipeline-buffer-data
            mountPath: /app/data/buffers
          - name: pipeline-buffer-utils
            mountPath: /app/utils/buffers.py
            subPath: buffers.py
      volumes:
      - name: pipeline-buffer-data
        persistentVolumeClaim:
          claimName: pipeline-buffer-data-claim
      - name: pipeline-kafka-consumer
        configMap:
          name: eaer-kafka-consumer
      - name: pipeline-config
        configMap:
          name: er-pipeline-config
      - name: pipeline-data
        persistentVolumeClaim:
          claimName: pipeline-data-claim
      - name: pipeline-buffer-utils
        configMap:
          name: eaer-kafka-buffers

    - name: embedding-training-dag
      inputs:
        parameters:
        - name: mode
      dag:
        tasks:
        - name: normalization
          template: normalization
          arguments:
            parameters:
            - name: raw_data
              value: '{{workflow.parameters.raw_data}}'
            - name: data_source_A
              value: '{{workflow.parameters.data_source_A}}'
            - name: data_source_B
              value: '{{workflow.parameters.data_source_B}}'
            - name: mode
              value: '{{inputs.parameters.mode}}'
        
        - name: graph-construction
          template: graph
          depends: normalization.Succeeded
          arguments:
            parameters:
            - name: mode
              value: '{{inputs.parameters.mode}}'
            - name: function
              value: graph_construction
            artifacts:
            - name: processed_data
              from: '{{tasks.normalization.outputs.artifacts.processed_data}}'

        - name: random-walk
          template: graph
          depends: graph-construction.Succeeded
          arguments:
            parameters:
            - name: mode
              value: '{{inputs.parameters.mode}}'
            - name: function
              value: random_walk

        - name: embedding-training
          template: embedding
          depends: random-walk.Succeeded
          arguments:
            parameters:
            - name: mode
              value: '{{inputs.parameters.mode}}'
            - name: function
              value: embedding_training

        - name: cg-feature-extraction
          template: cg-feature-extraction
          depends: normalization.Succeeded
          arguments:
            parameters:
            - name: mode
              value: '{{inputs.parameters.mode}}'
            artifacts:
            - name: processed_data
              from: '{{tasks.normalization.outputs.artifacts.processed_data}}'

        - name: feature-index-construction
          template: feature-index
          depends: cg-feature-extraction.Succeeded
          arguments:
            artifacts:
            - name: cg_feature
              from: '{{tasks.cg-feature-extraction.outputs.artifacts.cg_feature}}'
            parameters:
            - name: mode
              value: '{{inputs.parameters.mode}}'
            - name: function
              value: feature_index_construction

        - name: evaluation
          depends: feature-index-construction.Succeeded && embedding-training.Succeeded
          when: "'{{inputs.parameters.mode}}' =~ '.*evaluation.*' && !('{{inputs.parameters.mode}}' =~ '.*inference.*')"
          template: prediction
          arguments:
            parameters:
            - name: mode
              value: '{{inputs.parameters.mode}}'
            - name: function
              value: evaluation
      
    - name: embedding-inference-dag
      inputs:
        parameters:
        - name: mode
      dag:
        tasks:
        - name: normalization
          template: normalization
          arguments:
            parameters:
            - name: raw_data
              value: '{{workflow.parameters.raw_data}}'
            - name: data_source_A
              value: '{{workflow.parameters.data_source_A}}'
            - name: data_source_B
              value: '{{workflow.parameters.data_source_B}}'
            - name: mode
              value: '{{inputs.parameters.mode}}-inc'
        
        - name: graph-construction
          template: graph
          arguments:
            parameters:
            - name: mode
              value: embedding-inference
            - name: function
              value: graph_construction

        - name: random-walk
          template: graph
          arguments:
            parameters:
            - name: mode
              value: embedding-inference
            - name: function
              value: random_walk

        - name: embedding-training
          template: embedding
          arguments:
            parameters:
            - name: mode
              value: embedding-inference
            - name: function
              value: embedding_training

        - name: cg-feature-extraction
          template: cg-feature-extraction
          arguments:
            parameters:
            - name: mode
              value: embedding-inference

        - name: feature-index-construction
          template: feature-index
          arguments:
            parameters:
            - name: mode
              value: embedding-inference
            - name: function
              value: feature_index_construction

        - name: candidate-enumeration
          template: feature-index
          arguments:
            parameters:
            - name: mode
              value: embedding-inference
            - name: function
              value: candidate_enumeration

        - name: calculating-similarity
          template: embedding
          arguments:
            parameters:
            - name: mode
              value: embedding-inference
            - name: function
              value: calculating_similarity

        - name: decision-making
          template: prediction
          arguments:
            parameters:
            - name: mode
              value: embedding-inference
            - name: function
              value: decision_making

        - name: evaluation
          depends: decision-making.Succeeded
          when: "'{{inputs.parameters.mode}}' =~ '.*evaluation.*'"
          template: prediction
          arguments:
            parameters:
            - name: mode
              value: '{{inputs.parameters.mode}}'
            - name: function
              value: evaluation

    - name: main
      dag:
        tasks:
        - name: pipeline-init
          template: pipeline-init
          arguments:
            parameters:
            - name: fallback_mode
              value: '{{workflow.parameters.mode}}'

        - name: kafka-producer
          template: kafka-producer
          depends: pipeline-init.Succeeded && ( embedding-training.Succeeded || embedding-training.Skipped )
          when: "'{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*embedding.*' && '{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*inference.*'"

        - name: kafka-consumer
          template: kafka-consumer
          depends: kafka-producer.Daemoned

        - name: embedding-training
          depends: pipeline-init.Succeeded
          when: "'{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*embedding.*' && '{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*training.*'"
          template: embedding-training-dag
          arguments:
            parameters:
            - name: mode
              value: embedding-training

        - name: embedding-inference
          depends: kafka-consumer.Daemoned && ( embedding-training.Succeeded || embedding-training.Skipped )
          when: "'{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*embedding.*' && '{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*inference.*'"
          template: embedding-inference-dag
          arguments:
            parameters:
            - name: mode
              value: '{{tasks.pipeline-init.outputs.parameters.mode}}'

        - name: evaluation
          depends: pipeline-init.Succeeded && embedding-training.Skipped && (kafka-consumer.Succeeded || kafka-consumer.Omitted)
          when: "'{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*embedding.*' && '{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*evaluation.*' && !('{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*inference.*')"
          template: prediction
          arguments:
            parameters:
            - name: mode
              value: '{{tasks.pipeline-init.outputs.parameters.mode}}'
            - name: function
              value: evaluation

        - name: bert-normalization-training
          depends: pipeline-init.Succeeded
          when: "'{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*bert.*' && '{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*training.*'"
          template: normalization
          arguments:
            parameters:
            - name: raw_data
              value: '{{workflow.parameters.raw_data}}'
            - name: data_source_A
              value: '{{workflow.parameters.data_source_A}}'
            - name: data_source_B
              value: '{{workflow.parameters.data_source_B}}'
            - name: mode
              value: bert-training

        - name: bert-training
          depends: bert-normalization-training.Succeeded
          template: bert
          arguments:
            artifacts:
            - name: processed_data
              from: '{{tasks.bert-normalization-training.outputs.artifacts.processed_data}}'
            parameters:
            - name: mode
              value: bert-training

        - name: bert-normalization-inference
          depends: "pipeline-init.Succeeded && (bert-training.Succeeded || bert-training.Omitted)"
          when: "'{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*bert.*' && '{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*inference.*'"
          template: normalization
          arguments:
            parameters:
            - name: raw_data
              value: '{{workflow.parameters.raw_data}}'
            - name: data_source_A
              value: '{{workflow.parameters.data_source_A}}'
            - name: data_source_B
              value: '{{workflow.parameters.data_source_B}}'
            - name: mode
              value: bert-inference

        - name: bert-inference
          depends: bert-normalization-inference.Succeeded
          template: bert
          arguments:
            artifacts:
            - name: processed_data
              from: '{{tasks.bert-normalization-inference.outputs.artifacts.processed_data}}'
            parameters:
            - name: mode
              value: bert-inference

        - name: bert-normalization-b-evaluation
          depends: "pipeline-init.Succeeded && (bert-inference.Succeeded || bert-inference.Omitted) && (bert-training.Succeeded || bert-training.Omitted)"
          when: "'{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*bert.*' && '{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*b_evaluation.*'"
          template: normalization
          arguments:
            parameters:
            - name: raw_data
              value: '{{workflow.parameters.raw_data}}'
            - name: data_source_A
              value: '{{workflow.parameters.data_source_A}}'
            - name: data_source_B
              value: '{{workflow.parameters.data_source_B}}'
            - name: mode
              value: bert-b_evaluation

        - name: bert-evaluation
          depends: bert-normalization-b-evaluation.Succeeded
          template: bert
          arguments:
            artifacts:
            - name: processed_data
              from: '{{tasks.bert-normalization-b-evaluation.outputs.artifacts.processed_data}}'
            parameters:
            - name: mode
              value: bert-b_evaluation