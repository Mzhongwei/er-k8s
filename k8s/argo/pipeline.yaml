# TODO: Mount volumes on data instead of cache
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: pipeline-
  namespace: argo
spec:
  imagePullSecrets:
  - name: regcred
  podGC:
    strategy: OnWorkflowCompletion
    deleteDelayDuration: 30m
  ttlStrategy:
    secondsAfterSuccess: 3600
    secondsAfterFailure: 86400
  artifactGC:
    strategy: OnWorkflowCompletion
  arguments:
    parameters:
    - name: mode
      value: embedding-evaluation
    - name: raw_data
      value: Data_example/bert/train.csv
    - name: data_source_A
      value: Data_example/fodors_zagats-tableA.csv
    - name: data_source_B
      value: Data_example/fodors_zagats-tableB.csv
  entrypoint: main
  templates:
    - name: normalization
      inputs:
        parameters:
        - name: mode
        - name: raw_data
        - name: data_source_A
        - name: data_source_B
      container:
        name: main
        image: kevinoulai/erctl:normalization
        command: [sh, -c]
        args:
        - |
          /opt/venv/bin/python /app/distributions/normalization_distribution.py --mode '{{inputs.parameters.mode}}' --raw_data '{{inputs.parameters.raw_data}}' --data_source_A '{{inputs.parameters.data_source_A}}' --data_source_B '{{inputs.parameters.data_source_B}}' > /tmp/processed_data
        env:
        - name: MODE
          value: '{{inputs.parameters.mode}}'
        volumeMounts:
        - name: pipeline-config
          mountPath: /app/config/examples/config-embedding.yaml
          subPath: config.yaml
        - name: normalization-distribution
          mountPath: /app/distributions/normalization_distribution.py
          subPath: normalization_distribution.py
        - name: pipeline-bert-data
          mountPath: /app/Data_example
      volumes:
      - name: pipeline-config
        configMap:
          name: er-pipeline-config
      - name: normalization-distribution
        configMap:
          name: eaer-normalization-distribution
      - name: pipeline-bert-data
        persistentVolumeClaim:
          claimName: pipeline-bert-data-claim
      outputs:
        parameters:
        - name: processed_data
          valueFrom:
            path: /tmp/processed_data

    - name: graph
      inputs:
        parameters:
        - name: processed_data
        - name: mode
        - name: function
      container:
        name: main
        image: kevinoulai/erctl:graph
        imagePullPolicy: Always
        command: [/opt/venv/bin/python, /app/distributions/graph_randomwalk.py]
        args:
        - --processed_data
        - '{{inputs.parameters.processed_data}}'
        - --mode
        - '{{inputs.parameters.mode}}'
        - --function
        - '{{inputs.parameters.function}}'
        - --output
        - /tmp/sequences.json
        volumeMounts:
        - name: pipeline-config
          mountPath: /app/config/examples/config-embedding.yaml
          subPath: config.yaml
        - name: graph-distribution
          mountPath: /app/distributions/graph_randomwalk.py
          subPath: graph_randomwalk.py
        - name: pipeline-graph-cache
          mountPath: /app/data
      volumes:
      - name: pipeline-config
        configMap:
          name: er-pipeline-config
      - name: graph-distribution
        configMap:
          name: eaer-graph-distribution
      - name: pipeline-graph-cache
        persistentVolumeClaim:
          claimName: pipeline-graph-cache-claim
      outputs:
        artifacts:
        - name: sequences
          path: /tmp/sequences.json

    - name: embedding
      inputs:
        artifacts:
        - name: sequences
          path: /tmp/sequences.json
          optional: true
        - name: candidate_pairs
          path: /tmp/candidate_pairs.json
          optional: true
        parameters:
        - name: mode
        - name: function
      container:
        name: main
        image: kevinoulai/erctl:embedding
        command: [/opt/venv/bin/python, /app/distributions/embedding_calculating.py]
        args:
        - --mode
        - '{{inputs.parameters.mode}}'
        - --sequences
        - /tmp/sequences.json
        - --candidate_pairs
        - /tmp/candidate_pairs.json
        - --function
        - '{{inputs.parameters.function}}'
        - --output
        - /tmp/matching_pairs.json
        volumeMounts:
        - name: pipeline-config
          mountPath: /app/config/examples/config-embedding.yaml
          subPath: config.yaml
        - name: embedding-distribution
          mountPath: /app/distributions/embedding_calculating.py
          subPath: embedding_calculating.py
        - name: pipeline-embedding-model-cache
          mountPath: /app/data
      volumes:
      - name: pipeline-config
        configMap:
          name: er-pipeline-config
      - name: embedding-distribution
        configMap:
          name: eaer-embedding-calculating
      - name: pipeline-embedding-model-cache
        persistentVolumeClaim:
          claimName: pipeline-embedding-model-cache-claim
      outputs:
        artifacts:
          - name: matching_pairs
            path: /tmp/matching_pairs.json

    - name: cg-feature-extraction
      inputs:
        parameters:
        - name: processed_data
      container:
        name: main
        image: kevinoulai/erctl:cgfeature
        command: [/opt/venv/bin/python, /app/distributions/cg_feature_distribution.py]
        args:
        - --processed_data
        - '{{inputs.parameters.processed_data}}'
        - --output
        - /tmp/cg_feature
        volumeMounts:
        - name: pipeline-config
          mountPath: /app/config/examples/config-embedding.yaml
          subPath: config.yaml
        - name: cg-feature-distribution
          mountPath: /app/distributions/cg_feature_distribution.py
          subPath: cg_feature_distribution.py
      volumes:
      - name: pipeline-config
        configMap:
          name: er-pipeline-config
      - name: cg-feature-distribution
        configMap:
          name: eaer-cg-feature-distribution
      outputs:
        parameters:
        - name: cg_feature
          valueFrom:
            path: /tmp/cg_feature

    - name: feature-index
      inputs:
        parameters:
        - name: cg_feature
        - name: mode
        - name: function
      container:
        name: main
        image: kevinoulai/erctl:featureindex
        imagePullPolicy: Always
        command: [/opt/venv/bin/python, /app/distributions/featureindex_candidate.py]
        args:
        - --cg_feature
        - '{{inputs.parameters.cg_feature}}'
        - --mode
        - '{{inputs.parameters.mode}}'
        - --function
        - '{{inputs.parameters.function}}'
        - --output
        - /tmp/candidate_pairs.json
        volumeMounts:
        - name: pipeline-config
          mountPath: /app/config/examples/config-embedding.yaml
          subPath: config.yaml
        - name: feature-index-distribution
          mountPath: /app/distributions/featureindex_candidate.py
          subPath: featureindex_candidate.py
        - name: pipeline-feature-index-cache
          mountPath: /app/data
      volumes:
      - name: pipeline-config
        configMap:
          name: er-pipeline-config
      - name: feature-index-distribution
        configMap:
          name: eaer-feature-index
      - name: pipeline-feature-index-cache
        persistentVolumeClaim:
          claimName: pipeline-feature-index-cache-claim
      outputs:
        artifacts:
        - name: candidate_pairs
          path: /tmp/candidate_pairs.json

    - name: prediction
      inputs:
        parameters:
        - name: mode
        - name: function
        artifacts:
        - name: matching_pairs
          path: /tmp/matching_pairs.json
          optional: true
      container:
        name: main
        image: kevinoulai/erctl:prediction
        command: [/opt/venv/bin/python, /app/distributions/decision_evaluation.py]
        args:
        - --mode
        - '{{inputs.parameters.mode}}'
        - --matching_pairs
        - '{{inputs.artifacts.matching_pairs.path}}'
        - --function
        - '{{inputs.parameters.function}}'
        - --output
        - /tmp/predicted_matching
        volumeMounts:
        - name: pipeline-config
          mountPath: /app/config/examples/config-embedding.yaml
          subPath: config.yaml
        - name: decision-evaluation-distribution
          mountPath: /app/distributions/decision_evaluation.py
          subPath: decision_evaluation.py
        - name: pipeline-bert-data
          mountPath: /app/Data_example
        #- name: pipeline-decision-evaluation-cache
        #  mountPath: /app/data
        - name: pipeline-embedding-model-cache
          mountPath: /app/data
      volumes:
      - name: pipeline-config
        configMap:
          name: er-pipeline-config
      - name: decision-evaluation-distribution
        configMap:
          name: eaer-decision-evaluation
      - name: pipeline-bert-data
        persistentVolumeClaim:
          claimName: pipeline-bert-data-claim
      #- name: pipeline-decision-evaluation-cache
      #  persistentVolumeClaim:
      #    claimName: pipeline-decision-evaluation-cache-claim
      - name: pipeline-embedding-model-cache
        persistentVolumeClaim:
          claimName: pipeline-embedding-model-cache-claim

      outputs:
        parameters:
        - name: predicted_matching
          valueFrom:
            path: /tmp/predicted_matching

    - name: bert
      inputs:
        parameters:
        - name: mode
        - name: processed_data
      container:
        name: main
        image: kevinoulai/erctl:bert
        imagePullPolicy: Always
        command: [/opt/venv/bin/python, /app/distributions/bert_distribution.py]
        args:
        - --mode
        - '{{inputs.parameters.mode}}'
        - --processed_data
        - '{{inputs.parameters.processed_data}}'
        - --output
        - /tmp/bert_output
        volumeMounts:
        - name: pipeline-config
          mountPath: /app/config/examples/config-bert.yaml
          subPath: config.yaml
        - name: pipeline-bert-model
          mountPath: /app/data/bert
        - name: bert-distribution
          mountPath: /app/distributions/bert_distribution.py
          subPath: bert_distribution.py
        - name: bert-training
          mountPath: /app/pipeline/bert_training.py
          subPath: bert_training.py
        - name: pipeline-bert-data
          mountPath: /app/Data_example
      volumes:
      - name: pipeline-config
        configMap:
          name: er-pipeline-config
      - name: pipeline-bert-model
        persistentVolumeClaim:
          claimName: pipeline-bert-model-claim
      - name: bert-distribution
        configMap:
          name: eaer-bert-distribution
      - name: bert-training
        configMap:
          name: eaer-bert-training
      - name: pipeline-bert-data
        persistentVolumeClaim:
          claimName: pipeline-bert-data-claim
      outputs:
        parameters:
        - name: bert_output
          valueFrom:
            path: /tmp/bert_output
      
    - name: pipeline-init
      inputs:
        parameters:
        - name: fallback_mode
      container:
        name: main
        image: kevinoulai/erctl:config
        imagePullPolicy: Always
        command: [sh, -c]
        args:
        - |
          set -eu
          FALLBACK_MODE='{{inputs.parameters.fallback_mode}}'
          CONFIG_SRC=""

          for p in /app/config/examples/config-embedding.yaml /app/examples/config.yaml; do
            if [ -f "$p" ]; then
              CONFIG_SRC="$p"
              break
            fi
          done

          if [ -n "$CONFIG_SRC" ]; then
            cp "$CONFIG_SRC" /tmp/config.yaml
          else
            printf 'mode: "%s"\n' "$FALLBACK_MODE" > /tmp/config.yaml
          fi

          MODE_FROM_CONFIG="$(sed -n 's/^mode:[[:space:]]*"\?\([^"#]*\)"\?.*/\1/p' /tmp/config.yaml | head -n1 | tr -d '\r')"

          if [ -z "$MODE_FROM_CONFIG" ]; then
            MODE_FROM_CONFIG="$FALLBACK_MODE"
          fi

          printf '%s' "$MODE_FROM_CONFIG" > /tmp/mode
        volumeMounts:
          - name: pipeline-config
            mountPath: /app/config/examples/config-embedding.yaml
            subPath: config.yaml
      volumes:
      - name: pipeline-config
        configMap:
          name: er-pipeline-config
      outputs:
        parameters:
        - name: mode
          valueFrom:
            path: /tmp/mode
        artifacts:
        - name: config
          path: /tmp/config.yaml

    - name: main
      dag:
        tasks:
        - name: pipeline-init
          template: pipeline-init
          arguments:
            parameters:
            - name: fallback_mode
              value: '{{workflow.parameters.mode}}'

        - name: normalization
          depends: pipeline-init.Succeeded
          when: "'{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*embedding.*' && ('{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*training.*' || '{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*inference.*' || '{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*evaluation.*')"
          template: normalization
          arguments:
            parameters:
            - name: raw_data
              value: '{{workflow.parameters.raw_data}}'
            - name: data_source_A
              value: '{{workflow.parameters.data_source_A}}'
            - name: data_source_B
              value: '{{workflow.parameters.data_source_B}}'
            - name: mode
              value: '{{tasks.pipeline-init.outputs.parameters.mode}}'

        - name: graph-construction
          when: "'{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*embedding.*' && ('{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*training.*' || '{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*inference.*')"
          template: graph
          depends: normalization.Succeeded
          arguments:
            parameters:
            - name: processed_data
              value: '{{tasks.normalization.outputs.parameters.processed_data}}'
            - name: mode
              value: '{{tasks.pipeline-init.outputs.parameters.mode}}'
            - name: function
              value: graph_construction

        - name: random-walk
          when: "'{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*embedding.*' && ('{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*training.*' || '{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*inference.*')"
          template: graph
          depends: graph-construction.Succeeded
          arguments:
            parameters:
            - name: processed_data
              value: '{{tasks.normalization.outputs.parameters.processed_data}}'
            - name: mode
              value: '{{tasks.pipeline-init.outputs.parameters.mode}}'
            - name: function
              value: random_walk

        - name: embedding-training
          when: "'{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*embedding.*' && ('{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*training.*' || '{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*inference.*')"
          template: embedding
          depends: random-walk.Succeeded
          arguments:
            artifacts:
            - name: sequences
              from: '{{tasks.random-walk.outputs.artifacts.sequences}}'
            parameters:
            - name: mode
              value: '{{tasks.pipeline-init.outputs.parameters.mode}}'
            - name: function
              value: embedding_training

        - name: cg-feature-extraction
          when: "'{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*embedding.*' && ('{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*training.*' || '{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*inference.*')"
          template: cg-feature-extraction
          depends: normalization.Succeeded
          arguments:
            parameters:
            - name: processed_data
              value: '{{tasks.normalization.outputs.parameters.processed_data}}'

        - name: feature-index-construction
          when: "'{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*embedding.*' && ('{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*training.*' || '{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*inference.*')"
          template: feature-index
          depends: cg-feature-extraction.Succeeded
          arguments:
            parameters:
            - name: cg_feature
              value: '{{tasks.cg-feature-extraction.outputs.parameters.cg_feature}}'
            - name: mode
              value: '{{tasks.pipeline-init.outputs.parameters.mode}}'
            - name: function
              value: feature_index_construction

        - name: candidate-enumeration
          when: "'{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*embedding.*' && '{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*inference.*'"
          template: feature-index
          depends: feature-index-construction.Succeeded
          arguments:
            parameters:
            - name: cg_feature
              value: '{{tasks.cg-feature-extraction.outputs.parameters.cg_feature}}'
            - name: mode
              value: '{{tasks.pipeline-init.outputs.parameters.mode}}'
            - name: function
              value: candidate_enumeration

        - name: calculating-similarity
          when: "'{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*embedding.*' && '{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*inference.*'"
          template: embedding
          depends: candidate-enumeration.Succeeded && embedding-training.Succeeded
          arguments:
            artifacts:
            - name: candidate_pairs
              from: '{{tasks.candidate-enumeration.outputs.artifacts.candidate_pairs}}'
            parameters:
            - name: mode
              value: '{{tasks.pipeline-init.outputs.parameters.mode}}'
            - name: function
              value: calculating_similarity

        - name: decision-making
          depends: calculating-similarity.Succeeded
          when: "'{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*embedding.*' && '{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*inference.*'"
          template: prediction
          arguments:
            parameters:
            - name: mode
              value: '{{tasks.pipeline-init.outputs.parameters.mode}}'
            - name: function
              value: decision_making
            artifacts:
            - name: matching_pairs
              from: '{{tasks.calculating-similarity.outputs.artifacts.matching_pairs}}'

        - name: evaluation
          depends: decision-making.Succeeded
          when: "'{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*embedding.*' && '{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*evaluation.*'"
          template: prediction
          arguments:
            parameters:
            - name: mode
              value: '{{tasks.pipeline-init.outputs.parameters.mode}}'
            - name: function
              value: evaluation

        - name: bert-normalization-training
          depends: pipeline-init.Succeeded
          when: "'{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*bert.*' && '{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*training.*'"
          template: normalization
          arguments:
            parameters:
            - name: raw_data
              value: '{{workflow.parameters.raw_data}}'
            - name: data_source_A
              value: '{{workflow.parameters.data_source_A}}'
            - name: data_source_B
              value: '{{workflow.parameters.data_source_B}}'
            - name: mode
              value: training

        - name: bert-training
          depends: bert-normalization-training.Succeeded
          when: "'{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*bert.*' && '{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*training.*'"
          template: bert
          arguments:
            parameters:
            - name: processed_data
              value: '{{tasks.bert-normalization-training.outputs.parameters.processed_data}}'
            - name: mode
              value: training

        - name: bert-normalization-inference
          depends: "pipeline-init.Succeeded && (bert-training.Succeeded || bert-training.Omitted)"
          when: "'{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*bert.*' && '{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*inference.*'"
          template: normalization
          arguments:
            parameters:
            - name: raw_data
              value: '{{workflow.parameters.raw_data}}'
            - name: data_source_A
              value: '{{workflow.parameters.data_source_A}}'
            - name: data_source_B
              value: '{{workflow.parameters.data_source_B}}'
            - name: mode
              value: bert-inference

        - name: bert-inference
          depends: bert-normalization-inference.Succeeded
          when: "'{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*bert.*' && '{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*inference.*'"
          template: bert
          arguments:
            parameters:
            - name: processed_data
              value: '{{tasks.bert-normalization-inference.outputs.parameters.processed_data}}'
            - name: mode
              value: bert-inference

        - name: bert-normalization-b-evaluation
          depends: "pipeline-init.Succeeded && (bert-inference.Succeeded || bert-inference.Omitted) && (bert-training.Succeeded || bert-training.Omitted)"
          when: "'{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*bert.*' && '{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*b_evaluation.*'"
          template: normalization
          arguments:
            parameters:
            - name: raw_data
              value: '{{workflow.parameters.raw_data}}'
            - name: data_source_A
              value: '{{workflow.parameters.data_source_A}}'
            - name: data_source_B
              value: '{{workflow.parameters.data_source_B}}'
            - name: mode
              value: bert-b_evaluation

        - name: bert-evaluation
          depends: bert-normalization-b-evaluation.Succeeded
          when: "'{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*bert.*' && '{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*b_evaluation.*'"
          template: bert
          arguments:
            parameters:
            - name: processed_data
              value: '{{tasks.bert-normalization-b-evaluation.outputs.parameters.processed_data}}'
            - name: mode
              value: b_evaluation