apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-server
  labels:
    app.kubernetes.io/name: kafka-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-server
    spec:
      securityContext:
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
      - name: init-redpanda-data-perms
        image: busybox:1.36
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          allowPrivilegeEscalation: false
        command:
          - sh
          - -c
          - set -eux; mkdir -p /var/lib/redpanda/data; chown -R 101:101 /var/lib/redpanda/data; chmod -R ug+rwX /var/lib/redpanda/data
        volumeMounts:
          - name: redpanda-data
            mountPath: /var/lib/redpanda/data
      containers:
      - name: kafka-server
        image: kevinoulai/kafka:server
        imagePullPolicy: Always
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          allowPrivilegeEscalation: false
        command:
          - redpanda
          - --redpanda-cfg
          - /etc/redpanda/redpanda.yaml
        ports:
          - containerPort: 9092
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: "2"
            memory: 2Gi
        volumeMounts:
          - name: redpanda-config
            mountPath: /etc/redpanda/redpanda.yaml
            subPath: redpanda.yaml
          - name: redpanda-data
            mountPath: /var/lib/redpanda/data
      volumes:
        - name: redpanda-config
          configMap:
            name: kafka-server-redpanda-config
        - name: redpanda-data
          persistentVolumeClaim:
            claimName: pipeline-kafka-data-claim
