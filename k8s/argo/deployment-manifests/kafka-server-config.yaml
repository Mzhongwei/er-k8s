apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-server-redpanda-config
  namespace: argo
  labels:
    app.kubernetes.io/name: kafka-server
data:
  redpanda.yaml: |
    redpanda:
      data_directory: "/var/lib/redpanda/data"
      seed_servers: []
      rpc_server:
        address: "0.0.0.0"
        port: 33145
      advertised_rpc_api:
        address: "kafka-server"
        port: 33145
      kafka_api:
        - address: "0.0.0.0"
          port: 9092
      advertised_kafka_api:
        - address: "kafka-server"
          port: 9092
      admin:
        address: "0.0.0.0"
        port: 9644
      developer_mode: true
    pandaproxy: {}
    schema_registry: {}
    rpk:
      tune_network: false
      tune_disk_scheduler: false
      tune_disk_nomerges: false
      tune_disk_irq: false
      tune_fstrim: false
      tune_cpu: false
      tune_aio_events: false
      tune_clocksource: false
      tune_swappiness: false
      enable_memory_locking: false
      tune_coredump: false
      coredump_dir: "/var/lib/redpanda/data/coredump"
