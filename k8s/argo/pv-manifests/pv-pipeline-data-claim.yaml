apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-pipeline-data-claim
spec:
  capacity:
    storage: 100Mi
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  persistentVolumeReclaimPolicy: Delete
  hostPath:
    path: /tmp/eaer/pv/pipeline-data-claim
  claimRef:
    namespace: argo
    name: pipeline-data-claim
  volumeMode: Filesystem
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
            - server2-labo
