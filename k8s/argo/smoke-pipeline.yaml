apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: pipeline-
  namespace: argo
spec:
  imagePullSecrets:
  - name: regcred
  arguments:
    parameters:
    - name: mode
      value: bert-training-b_evaluation
    - name: raw_data
      value: source_data
    - name: data_source_A
      value: source_data_A
    - name: data_source_B
      value: source_data_B
  entrypoint: main
  templates:
    - name: normalization
      inputs:
        parameters:
        - name: mode
        - name: raw_data
        - name: data_source_A
        - name: data_source_B
      container:
        name: main
        image: busybox
        command: [sh, -c]
        args:
        - |
          echo "processed_data_from_${MODE}" > /tmp/processed_data
        env:
        - name: MODE
          value: '{{inputs.parameters.mode}}'
        volumeMounts:
        - name: normalization-distribution
          mountPath: /app/distributions/normalization_distribution.py
          subPath: normalization_distribution.py
      volumes:
      - name: normalization-distribution
        configMap:
          name: eaer-normalization-distribution
      outputs:
        parameters:
        - name: processed_data
          valueFrom:
            path: /tmp/processed_data

    - name: graph-construction
      inputs:
        parameters:
        - name: processed_data
      container:
        name: main
        image: busybox
        command: [sh, -c]
        args:
        - |
          echo "graph_from_{{inputs.parameters.processed_data}}" > /tmp/graph
      outputs:
        parameters:
        - name: graph
          valueFrom:
            path: /tmp/graph

    - name: random-walk
      inputs:
        parameters:
        - name: graph
      container:
        name: main
        image: busybox
        command: [sh, -c]
        args:
        - |
          echo "sequences_from_{{inputs.parameters.graph}}" > /tmp/sequences
      outputs:
        parameters:
        - name: sequences
          valueFrom:
            path: /tmp/sequences

    - name: embedding-training
      inputs:
        parameters:
        - name: sequences
      container:
        name: main
        image: busybox
        command: [sh, -c]
        args:
        - |
          echo "embedding_model_from_{{inputs.parameters.sequences}}" > /tmp/embedding_model
      outputs:
        parameters:
        - name: embedding_model
          valueFrom:
            path: /tmp/embedding_model

    - name: cg-feature-extraction
      inputs:
        parameters:
        - name: processed_data
      container:
        name: main
        image: busybox
        command: [sh, -c]
        args:
        - |
          echo "cg_feature_from_{{inputs.parameters.processed_data}}" > /tmp/cg_feature
      outputs:
        parameters:
        - name: cg_feature
          valueFrom:
            path: /tmp/cg_feature

    - name: feature-index-construction
      inputs:
        parameters:
        - name: cg_feature
      container:
        name: main
        image: busybox
        command: [sh, -c]
        args:
        - |
          echo "feature_index_from_{{inputs.parameters.cg_feature}}" > /tmp/feature_index
      outputs:
        parameters:
        - name: feature_index
          valueFrom:
            path: /tmp/feature_index

    - name: candidate-enumeration
      inputs:
        parameters:
        - name: feature_index
      container:
        name: main
        image: busybox
        command: [sh, -c]
        args:
        - |
          echo "candidate_pairs_from_{{inputs.parameters.feature_index}}" > /tmp/candidate_pairs
      outputs:
        parameters:
        - name: candidate_pairs
          valueFrom:
            path: /tmp/candidate_pairs

    - name: calculating-similarity
      inputs:
        parameters:
        - name: candidate_pairs
        - name: embedding_model
      container:
        name: main
        image: busybox
        command: [sh, -c]
        args:
        - |
          echo "matching_pairs_from_{{inputs.parameters.candidate_pairs}}_and_{{inputs.parameters.embedding_model}}" > /tmp/matching_pairs
      outputs:
        parameters:
        - name: matching_pairs
          valueFrom:
            path: /tmp/matching_pairs

    - name: decision-making
      inputs:
        parameters:
        - name: matching_pairs
      container:
        name: main
        image: busybox
        command: [sh, -c]
        args:
        - |
          echo "predicted_matching_from_{{inputs.parameters.matching_pairs}}" > /tmp/predicted_matching
      outputs:
        parameters:
        - name: predicted_matching
          valueFrom:
            path: /tmp/predicted_matching

    - name: evaluation
      inputs:
        parameters:
        - name: predicted_matching
      container:
        name: main
        image: busybox
        command: [sh, -c]
        args:
        - |
          echo "result_from_{{inputs.parameters.predicted_matching}}" > /tmp/result
      outputs:
        parameters:
        - name: result
          valueFrom:
            path: /tmp/result

    - name: bert
      inputs:
        parameters:
        - name: mode
        - name: processed_data
      container:
        name: main
        image: busybox
        command: [sh, -c]
        args:
        - |
          echo "bert_output_{{inputs.parameters.mode}}_from_{{inputs.parameters.processed_data}}" > /tmp/bert_output
        volumeMounts:
        - name: bert-distribution
          mountPath: /app/distributions/bert_distribution.py
          subPath: bert_distribution.py
      volumes:
      - name: bert-distribution
        configMap:
          name: eaer-bert-distribution
      outputs:
        parameters:
        - name: bert_output
          valueFrom:
            path: /tmp/bert_output
      
    - name: pipeline-init
      inputs:
        parameters:
        - name: fallback_mode
      container:
        name: main
        image: busybox:1.36
        command: [sh, -c]
        args:
        - |
          set -eu
          FALLBACK_MODE='{{inputs.parameters.fallback_mode}}'
          CONFIG_SRC=""

          for p in /app/config/examples/config-embedding.yaml /app/examples/config.yaml; do
            if [ -f "$p" ]; then
              CONFIG_SRC="$p"
              break
            fi
          done

          if [ -n "$CONFIG_SRC" ]; then
            cp "$CONFIG_SRC" /tmp/config.yaml
          else
            printf 'mode: "%s"\n' "$FALLBACK_MODE" > /tmp/config.yaml
          fi

          MODE_FROM_CONFIG="$(sed -n 's/^mode:[[:space:]]*"\?\([^"#]*\)"\?.*/\1/p' /tmp/config.yaml | head -n1 | tr -d '\r')"

          if [ -z "$MODE_FROM_CONFIG" ]; then
            MODE_FROM_CONFIG="$FALLBACK_MODE"
          fi

          printf '%s' "$MODE_FROM_CONFIG" > /tmp/mode
        volumeMounts:
          - name: pipeline-config
            mountPath: /app/config/examples/config-embedding.yaml
            subPath: config.yaml
      volumes:
      - name: pipeline-config
        configMap:
          name: er-pipeline-config
      outputs:
        parameters:
        - name: mode
          valueFrom:
            path: /tmp/mode
        artifacts:
        - name: config
          path: /tmp/config.yaml

    - name: main
      dag:
        tasks:
        - name: pipeline-init
          template: pipeline-init
          arguments:
            parameters:
            - name: fallback_mode
              value: '{{workflow.parameters.mode}}'

        - name: normalization
          depends: pipeline-init.Succeeded
          when: "'{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*embedding.*' && ('{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*training.*' || '{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*inference.*')"
          template: normalization
          arguments:
            parameters:
            - name: raw_data
              value: '{{workflow.parameters.raw_data}}'
            - name: data_source_A
              value: '{{workflow.parameters.data_source_A}}'
            - name: data_source_B
              value: '{{workflow.parameters.data_source_B}}'
            - name: mode
              value: '{{tasks.pipeline-init.outputs.parameters.mode}}'

        - name: graph-construction
          when: "'{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*embedding.*' && ('{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*training.*' || '{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*inference.*')"
          template: graph-construction
          depends: normalization.Succeeded
          arguments:
            parameters:
            - name: processed_data
              value: '{{tasks.normalization.outputs.parameters.processed_data}}'

        - name: random-walk
          when: "'{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*embedding.*' && ('{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*training.*' || '{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*inference.*')"
          template: random-walk
          depends: graph-construction.Succeeded
          arguments:
            parameters:
            - name: graph
              value: '{{tasks.graph-construction.outputs.parameters.graph}}'

        - name: embedding-training
          when: "'{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*embedding.*' && ('{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*training.*' || '{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*inference.*')"
          template: embedding-training
          depends: random-walk.Succeeded
          arguments:
            parameters:
            - name: sequences
              value: '{{tasks.random-walk.outputs.parameters.sequences}}'

        - name: cg-feature-extraction
          when: "'{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*embedding.*' && ('{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*training.*' || '{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*inference.*')"
          template: cg-feature-extraction
          depends: normalization.Succeeded
          arguments:
            parameters:
            - name: processed_data
              value: '{{tasks.normalization.outputs.parameters.processed_data}}'

        - name: feature-index-construction
          when: "'{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*embedding.*' && ('{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*training.*' || '{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*inference.*')"
          template: feature-index-construction
          depends: cg-feature-extraction.Succeeded
          arguments:
            parameters:
            - name: cg_feature
              value: '{{tasks.cg-feature-extraction.outputs.parameters.cg_feature}}'

        - name: candidate-enumeration
          when: "'{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*embedding.*' && '{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*inference.*'"
          template: candidate-enumeration
          depends: feature-index-construction.Succeeded
          arguments:
            parameters:
            - name: feature_index
              value: '{{tasks.feature-index-construction.outputs.parameters.feature_index}}'

        - name: calculating-similarity
          when: "'{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*embedding.*' && '{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*inference.*'"
          template: calculating-similarity
          depends: candidate-enumeration.Succeeded && embedding-training.Succeeded
          arguments:
            parameters:
            - name: candidate_pairs
              value: '{{tasks.candidate-enumeration.outputs.parameters.candidate_pairs}}'
            - name: embedding_model
              value: '{{tasks.embedding-training.outputs.parameters.embedding_model}}'

        - name: decision-making
          depends: calculating-similarity.Succeeded
          when: "'{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*embedding.*' && '{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*inference.*'"
          template: decision-making
          arguments:
            parameters:
            - name: matching_pairs
              value: '{{tasks.calculating-similarity.outputs.parameters.matching_pairs}}'

        - name: evaluation
          depends: pipeline-init.Succeeded && ( decision-making.Succeeded || decision-making.Omitted )
          when: "'{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*embedding.*' && '{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*evaluation.*'"
          template: evaluation
          arguments:
            parameters:
            - name: predicted_matching
              value: '{{tasks.decision-making.outputs.parameters.predicted_matching}}'

        - name: bert-normalization-training
          depends: pipeline-init.Succeeded
          when: "'{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*bert.*' && '{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*training.*'"
          template: normalization
          arguments:
            parameters:
            - name: raw_data
              value: '{{workflow.parameters.raw_data}}'
            - name: data_source_A
              value: '{{workflow.parameters.data_source_A}}'
            - name: data_source_B
              value: '{{workflow.parameters.data_source_B}}'
            - name: mode
              value: training

        - name: bert-training
          depends: bert-normalization-training.Succeeded
          when: "'{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*bert.*' && '{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*training.*'"
          template: bert
          arguments:
            parameters:
            - name: processed_data
              value: '{{tasks.bert-normalization-training.outputs.parameters.processed_data}}'
            - name: mode
              value: training

        - name: bert-normalization-inference
          depends: "pipeline-init.Succeeded && (bert-training.Succeeded || bert-training.Omitted)"
          when: "'{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*bert.*' && '{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*inference.*'"
          template: normalization
          arguments:
            parameters:
            - name: raw_data
              value: '{{workflow.parameters.raw_data}}'
            - name: data_source_A
              value: '{{workflow.parameters.data_source_A}}'
            - name: data_source_B
              value: '{{workflow.parameters.data_source_B}}'
            - name: mode
              value: bert-inference

        - name: bert-inference
          depends: bert-normalization-inference.Succeeded
          when: "'{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*bert.*' && '{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*inference.*'"
          template: bert
          arguments:
            parameters:
            - name: processed_data
              value: '{{tasks.bert-normalization-inference.outputs.parameters.processed_data}}'
            - name: mode
              value: bert-inference

        - name: bert-normalization-b-evaluation
          depends: "pipeline-init.Succeeded && (bert-inference.Succeeded || bert-inference.Omitted) && (bert-training.Succeeded || bert-training.Omitted)"
          when: "'{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*bert.*' && '{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*b_evaluation.*'"
          template: normalization
          arguments:
            parameters:
            - name: raw_data
              value: '{{workflow.parameters.raw_data}}'
            - name: data_source_A
              value: '{{workflow.parameters.data_source_A}}'
            - name: data_source_B
              value: '{{workflow.parameters.data_source_B}}'
            - name: mode
              value: bert-b_evaluation

        - name: bert-evaluation
          depends: bert-normalization-b-evaluation.Succeeded
          when: "'{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*bert.*' && '{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*b_evaluation.*'"
          template: bert
          arguments:
            parameters:
            - name: processed_data
              value: '{{tasks.bert-normalization-b-evaluation.outputs.parameters.processed_data}}'
            - name: mode
              value: b_evaluation