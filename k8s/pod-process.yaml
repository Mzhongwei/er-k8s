apiVersion: v1
kind: Pod
metadata:
  name: process
  labels:
    app.kubernetes.io/name: process
    app: process
spec:
  containers:
  - name: process
    image: python:3.12-alpine
    command: ["python", "/app/process_content.py"]
    volumeMounts:
    - name: scripts
      mountPath: /app
      readOnly: true
    resources:
      limits:
        memory: "128Mi"
        cpu: "500m"
      requests:
        memory: "64Mi"
        cpu: "250m"
    ports:
    - containerPort: 8080
  volumes:
  - name: scripts
    configMap:
      name: pod-scripts
      items:
      - key: process_content.py
        path: process_content.py