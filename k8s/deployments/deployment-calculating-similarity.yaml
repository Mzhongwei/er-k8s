apiVersion: apps/v1
kind: Deployment
metadata:
  name: calculating-similarity
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: calculating-similarity
  template:
    metadata:
      labels:
        app: calculating-similarity
    spec:
      containers:
      - name: calculating-similarity
        image: eaer-k8s:slim
        imagePullPolicy: Never
        command: ["python", "/scripts/calculating_similarity.py"]
        resources:
          limits:
            memory: "128Mi"
            cpu: "500m"
          requests:
            memory: "32Mi"
            cpu: "50m"
        ports:
        - containerPort: 8080
        - containerPort: 8081
        volumeMounts:
        - name: scripts
          mountPath: /scripts
          readOnly: true
        - name: pipeline-embedding-claim
          mountPath: /pipeline
      volumes:
      - name: scripts
        configMap:
          name: calculating-similarity
          items:
          - key: calculating_similarity.py
            path: calculating_similarity.py
      - name: pipeline-embedding-claim
        persistentVolumeClaim:
          claimName: pipeline-embedding-claim