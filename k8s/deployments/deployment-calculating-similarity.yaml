apiVersion: apps/v1
kind: Deployment
metadata:
  name: calculating-similarity
spec:
  selector:
    matchLabels:
      app: calculating-similarity
  template:
    metadata:
      labels:
        app: calculating-similarity
    spec:
      containers:
      - name: calculating-similarity
        image: python:3.12-alpine
        command: ["python", "/app/calculating_similarity.py"]
        resources:
          limits:
            memory: "128Mi"
            cpu: "500m"
          requests:
            memory: "64Mi"
            cpu: "250m"
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: scripts
          mountPath: /app
          readOnly: true
      volumes:
      - name: scripts
        configMap:
          name: calculating-similarity
          items:
          - key: calculating_similarity.py
            path: calculating_similarity.py