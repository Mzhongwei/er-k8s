apiVersion: apps/v1
kind: Deployment
metadata:
  name: random-walk
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: random-walk
  template:
    metadata:
      labels:
        app: random-walk
    spec:
      containers:
      - name: random-walk
        image: python:3.12-alpine
        imagePullPolicy: Never
        command: ["python", "/app/random_walk.py"]
        resources:
          limits:
            memory: "128Mi"
            cpu: "500m"
          requests:
            memory: "32Mi"
            cpu: "50m"
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: scripts
          mountPath: /app
          readOnly: true
      volumes:
      - name: scripts
        configMap:
          name: random-walk
          items:
          - key: random_walk.py
            path: random_walk.py



