apiVersion: apps/v1
kind: Deployment
metadata:
  name: candidate-enumeration
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: candidate-enumeration
  template:
    metadata:
      labels:
        app: candidate-enumeration
    spec:
      containers:
      - name: candidate-enumeration
        image: python:3.12-alpine
        imagePullPolicy: Never
        command: ["python", "/app/candidate_enumeration.py"]
        resources:
          limits:
            memory: "128Mi"
            cpu: "500m"
          requests:
            memory: "32Mi"
            cpu: "50m"
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: scripts
          mountPath: /app
          readOnly: true
      volumes:
      - name: scripts
        configMap:
          name: candidate-enumeration
          items:
          - key: candidate_enumeration.py
            path: candidate_enumeration.py



