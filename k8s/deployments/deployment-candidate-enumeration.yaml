apiVersion: apps/v1
kind: Deployment
metadata:
  name: candidate-enumeration
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: candidate-enumeration
  template:
    metadata:
      labels:
        app: candidate-enumeration
    spec:
      containers:
      - name: candidate-enumeration
        image: eaer-k8s:slim
        imagePullPolicy: Never
        command: ["python", "/scripts/candidate_enumeration.py"]
        resources:
          limits:
            memory: "128Mi"
            cpu: "500m"
          requests:
            memory: "32Mi"
            cpu: "50m"
        ports:
        - containerPort: 8080
        - containerPort: 8081
        volumeMounts:
        - name: scripts
          mountPath: /scripts
          readOnly: true
        - name: pipeline-cg-features-claim
          mountPath: /pipeline
      volumes:
      - name: scripts
        configMap:
          name: candidate-enumeration
          items:
          - key: candidate_enumeration.py
            path: candidate_enumeration.py
      - name: pipeline-cg-features-claim
        persistentVolumeClaim:
          claimName: pipeline-cg-features-claim