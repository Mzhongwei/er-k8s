apiVersion: apps/v1
kind: Deployment
metadata:
  name: bert-evaluation
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bert-evaluation
  template:
    metadata:
      labels:
        app: bert-evaluation
    spec:
      containers:
      - name: bert-evaluation
        image: eaer-k8s:latest
        imagePullPolicy: Never
        command: ["python", "/app/BERT_evaluation.py"]
        resources:
          limits:
            memory: "128Mi"
            cpu: "500m"
          requests:
            memory: "32Mi"
            cpu: "50m"
        ports:
        - containerPort: 8080
        - containerPort: 8081
        volumeMounts:
        - name: scripts
          mountPath: /app
          readOnly: true
        - name: pipeline-bert-model-claim
          mountPath: /pipeline
      volumes:
      - name: scripts
        configMap:
          name: bert-evaluation
          items:
          - key: BERT_evaluation.py
            path: BERT_evaluation.py
      - name: pipeline-bert-model-claim
        persistentVolumeClaim:
          claimName: pipeline-bert-model-claim