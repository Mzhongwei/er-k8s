apiVersion: apps/v1
kind: Deployment
metadata:
  name: normalization
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: normalization
  template:
    metadata:
      labels:
        app: normalization
    spec:
      containers:
      - name: normalization
        image: erctl:normalization
        imagePullPolicy: Never
        command: ["/bin/bash", "-c", "source /opt/venv/bin/activate && python /app/distributions/normalization_distribution.py"]
        securityContext:
          privileged: true
        resources:
          limits:
            memory: "512Mi"
            cpu: "1000m"
          requests:
            memory: "256Mi"
            cpu: "500m"
        ports:
        - containerPort: 8080



