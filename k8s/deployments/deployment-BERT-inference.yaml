apiVersion: apps/v1
kind: Deployment
metadata:
  name: bert-inference
spec:
  selector:
    matchLabels:
      app: bert-inference
  template:
    metadata:
      labels:
        app: bert-inference
    spec:
      containers:
      - name: bert-inference
        image: python:3.12-alpine
        command: ["python", "/app/BERT_inference.py"]
        resources:
          limits:
            memory: "128Mi"
            cpu: "500m"
          requests:
            memory: "64Mi"
            cpu: "250m"
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: scripts
          mountPath: /app
          readOnly: true
      volumes:
      - name: scripts
        configMap:
          name: bert-inference
          items:
          - key: BERT_inference.py
            path: BERT_inference.py
