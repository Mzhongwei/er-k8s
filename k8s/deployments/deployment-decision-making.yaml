apiVersion: apps/v1
kind: Deployment
metadata:
  name: decision-making
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: decision-making
  template:
    metadata:
      labels:
        app: decision-making
    spec:
      containers:
      - name: decision-making
        image: eaer-k8s:latest
        imagePullPolicy: Never
        command: ["python", "/app/decision_making.py"]
        resources:
          limits:
            memory: "128Mi"
            cpu: "500m"
          requests:
            memory: "32Mi"
            cpu: "50m"
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: scripts
          mountPath: /app
          readOnly: true
      volumes:
      - name: scripts
        configMap:
          name: decision-making
          items:
          - key: decision_making.py
            path: decision_making.py



