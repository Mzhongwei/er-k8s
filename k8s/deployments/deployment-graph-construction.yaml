apiVersion: apps/v1
kind: Deployment
metadata:
  name: graph-construction
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: graph-construction
  template:
    metadata:
      labels:
        app: graph-construction
    spec:
      containers:
      - name: graph-construction
        image: python:3.12-alpine
        imagePullPolicy: Never
        command: ["python", "/app/graph_construction.py"]
        resources:
          limits:
            memory: "128Mi"
            cpu: "500m"
          requests:
            memory: "32Mi"
            cpu: "50m"
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: scripts
          mountPath: /app
          readOnly: true
        - name: pipeline
          mountPath: /pipeline
      volumes:
      - name: scripts
        configMap:
          name: graph-construction
          items:
          - key: graph_construction.py
            path: graph_construction.py
      - name: pipeline
        persistentVolumeClaim:
          claimName: pipeline-graph-claim