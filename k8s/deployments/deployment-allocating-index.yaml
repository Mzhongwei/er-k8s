apiVersion: apps/v1
kind: Deployment
metadata:
  name: allocating-index
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: allocating-index
  template:
    metadata:
      labels:
        app: allocating-index
    spec:
      containers:
      - name: allocating-index
        image: python:3.12-alpine
        imagePullPolicy: Never
        command: ["python", "/app/allocating_index.py"]
        resources:
          limits:
            memory: "128Mi"
            cpu: "500m"
          requests:
            memory: "32Mi"
            cpu: "50m"
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: scripts
          mountPath: /app
          readOnly: true
      volumes:
      - name: scripts
        configMap:
          name: allocating-index
          items:
          - key: allocating_index.py
            path: allocating_index.py



