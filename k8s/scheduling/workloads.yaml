batch:
  deadline_class: none
  defaults:
    task:
      io_intensity: medium
      migratable: false
  templates:
    normalization:
      task: {data_ids: [datasets, pipeline_intermediate]}
    graph-construction:
      task: {io_intensity: high, data_ids: [pipeline_intermediate, graph_snapshot]}
    random-walk:
      task: {io_intensity: high, data_ids: [graph_snapshot, pipeline_intermediate]}
    embedding-training:
      task: {data_ids: [pipeline_intermediate, embedding_model]}
    cg-feature-extraction:
      task: {data_ids: [pipeline_intermediate]}
    feature-index-construction:
      task: {io_intensity: high, data_ids: [pipeline_intermediate, feature_index]}
    bert-normalization-training:
      task: {data_ids: [datasets, pipeline_intermediate]}
    bert-training:
      task: {gpu_required: true, data_ids: [pipeline_intermediate, bert_model]}
    bert-normalization-b-evaluation:
      task: {data_ids: [datasets, pipeline_intermediate]}
    bert-evaluation:
      task: {gpu_required: true, data_ids: [pipeline_intermediate, bert_model]}

incremental:
  deadline_class: flexible
  defaults:
    task:
      io_intensity: medium
      migratable: true
      data_ids: [pipeline_buffers]
  templates:
    kafka-producer:
      task: {migratable: false, data_ids: [datasets]}
    kafka-consumer:
      task: {migratable: false}
    normalization: {}
    graph-construction:
      task: {io_intensity: high, data_ids: [graph_snapshot, pipeline_buffers]}
    random-walk:
      task: {io_intensity: high}
    embedding-training:
      task: {data_ids: [embedding_model, pipeline_buffers]}
    cg-feature-extraction: {}
    candidate-enumeration:
      task: {data_ids: [feature_index, pipeline_buffers]}
    calculating-similarity: {}
    decision-making:
      task: {data_ids: [embedding_model, predicted_matching, pipeline_buffers]}
    evaluation:
      task: {data_ids: [datasets, pipeline_intermediate, pipeline_buffers]}
