    io_class: high
    workload_modes: [batch, service]
    storage_access: [nfs, local_path]
  zhongwei-lap:
    io_class: medium
    workload_modes: [batch, service]
    storage_access: [nfs]
  server1-k3s-worker:
    io_class: medium
    workload_modes: [batch, service]
    storage_access: [nfs]
  matis-asus-expertbook-b1500ceaey-b1500ceae:
    schedulable: false
    io_class: low
    workload_modes: [batch, service]
    storage_access: [nfs]
