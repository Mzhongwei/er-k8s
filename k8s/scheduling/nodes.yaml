# Stable node capabilities. Runtime utilization/power is merged by `erctl schedule`.
nodes:
  server2-labo:
    cpu_class: high
    memory_class: high
    gpu_type: generic
    io_class: high
    workload_modes: [batch, service]
    storage_access: [nfs, ceph, local_path]
  zhongwei-lap:
    schedulable: true
    cpu_class: medium
    memory_class: medium
    gpu_type: none
    io_class: medium
    workload_modes: [batch, service]
    storage_access: [nfs, ceph]
  server1-k3s-worker:
    cpu_class: medium
    memory_class: medium
    gpu_type: none
    io_class: medium
    workload_modes: [service]
    storage_access: [nfs]
  matis-asus-expertbook-b1500ceaey-b1500ceae:
    schedulable: false
    cpu_class: low
    memory_class: low
    gpu_type: none
    io_class: low
    workload_modes: [service]
    storage_access: [nfs]
