# Backs state_management.embedding-dir (/app/data/embedding). Shared by the batch training
# entry (EmbTrai-training.py seeds/persists it) and the incremental
# embedding-training worker, which keeps training it further from the seed, and the
# calculating-similarity worker, which reads its per-window checkpoints.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pipeline-embedding-model-cache-claim
  namespace: argo
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-client-delete
  resources:
    requests:
      storage: 100Mi
