# Backs state_management.feature_index-dir (/app/data/index). Written once by the batch
# training DAG (EmbTrai-feature_index_construction.py); read-only for the incremental
# candidate-enumeration worker.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pipeline-feature-index-cache-claim
  namespace: argo
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-client
  resources:
    requests:
      storage: 100Mi