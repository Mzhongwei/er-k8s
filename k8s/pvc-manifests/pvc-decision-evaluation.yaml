# Backs state_management.predicted_match-dir (/app/data/predicted, see
# config/examples/config-embedding.yaml). Mounted by calculating-similarity (decides and writes
# predicted_matching.csv) and bert-matching (writes bert_matching.csv) in
# k8s/pipeline/incremental/.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pipeline-decision-evaluation-cache-claim
  namespace: argo
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-client-delete
  resources:
    requests:
      storage: 100Mi