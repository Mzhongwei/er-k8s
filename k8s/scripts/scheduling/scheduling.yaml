# Placement experiment configuration. Change only `strategy` to select one policy:
# B0, C1, C2, C3, C4, C5, C6, C7, C8, H1, H2.
# lists compose policies, e.g. [C3, C7].
# Every strategy honors `schedulable: false`; B0 otherwise leaves placement to Kubernetes.
version: 2
strategy: B0

preferences:
  allow_gpu_for_cpu: false
  migration_threshold: 0.15
  max_power_watts: 500
  # Optional composition weights: {C3: 2, C7: 1}

# Stable node capabilities. Runtime utilization/power is merged by `erctl schedule`.
nodes:
  server2-labo:
    cpu_class: high
    memory_class: high
    gpu_type: generic
    io_class: high
    workload_modes: [batch, service]
    storage_access: [nfs, ceph, local_path]
  zhongwei-lap:
    schedulable: true
    cpu_class: medium
    memory_class: medium
    gpu_type: none
    io_class: medium
    workload_modes: [batch, service]
    storage_access: [nfs, ceph]
  server1-k3s-worker:
    cpu_class: medium
    memory_class: medium
    gpu_type: none
    io_class: medium
    workload_modes: [service]
    storage_access: [nfs]
  matis-asus-expertbook-b1500ceaey-b1500ceae:
    schedulable: false
    cpu_class: low
    memory_class: low
    gpu_type: none
    io_class: low
    workload_modes: [service]
    storage_access: [nfs]

data:
  graph_snapshot:
    storage_class: nfs
    size_class: GB
    locations: [server2-labo]
  pipeline_buffers:
    storage_class: nfs
    size_class: MB
    locations: [server1-k3s-worker]

batch:
  defaults:
    task:
      workload_mode: batch
      cpu_request: low
      memory_request: low
      io_intensity: medium
      deadline_class: none
      deferrable: true
      migratable: false
  templates:
    normalization: {}
    graph-construction:
      task: {io_intensity: high, data_ids: [graph_snapshot]}
    random-walk:
      task: {cpu_request: medium, io_intensity: high, data_ids: [graph_snapshot]}
    embedding-training:
      task: {cpu_request: high, memory_request: medium, data_ids: [graph_snapshot]}
    cg-feature-extraction: {}
    feature-index-construction:
      task: {io_intensity: high}
    bert-normalization-training: {}
    bert-training:
      task: {gpu_required: true, cpu_request: high, memory_request: high}
    bert-normalization-b-evaluation: {}
    bert-evaluation:
      task: {gpu_required: true, deadline_class: strict}

incremental:
  defaults:
    task:
      workload_mode: service
      cpu_request: low
      memory_request: low
      io_intensity: medium
      deadline_class: flexible
      deferrable: true
      migratable: true
      data_ids: [pipeline_buffers]
  templates:
    producer: {}
    consumer: {}
    normalization: {}
    graph-construction:
      task: {io_intensity: high, data_ids: [graph_snapshot, pipeline_buffers]}
    random-walk:
      task: {cpu_request: medium, io_intensity: high, data_ids: [graph_snapshot, pipeline_buffers]}
    embedding-training:
      task: {cpu_request: high, memory_request: medium}
    cg-feature-extraction: {}
    candidate-enumeration: {}
    calculating-similarity:
      task: {deadline_class: strict}
    decision-making:
      task: {deadline_class: strict}
    evaluation: {}
