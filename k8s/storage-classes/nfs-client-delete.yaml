apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nfs-client-delete
provisioner: cluster.local/nfs-client-nfs-subdir-external-provisioner
parameters:
  archiveOnDelete: "false"
reclaimPolicy: Delete
volumeBindingMode: Immediate
allowVolumeExpansion: true
# Stages poll for paths that do not exist yet (first buffer dir, checkpoint acks); the default
# negative lookup cache hides them from other nodes for up to acdirmax (60 s).
mountOptions:
  - lookupcache=positive
