apiVersion: batch/v1
kind: Job
metadata:
  name: decision-making
  labels:
    app: decision-making
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: decision-making
    spec:
      restartPolicy: OnFailure
      containers:
        - name: main
          image: kevinoulai/erctl:prediction
          imagePullPolicy: Always
          command: [/opt/venv/bin/python, /app/distributions/decision_evaluation.py]
          args:
            - --mode
            - embedding-inference
            - --function
            - decision_making
          env:
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: pipeline-config
              mountPath: /app/config/examples/config-embedding.yaml
              subPath: config.yaml
            - name: decision-evaluation-distribution
              mountPath: /app/distributions/decision_evaluation.py
              subPath: decision_evaluation.py
            - name: pipeline-data
              mountPath: /data
            - name: pipeline-embedding-model-cache
              mountPath: /app/data
            - name: pipeline-buffer-data
              mountPath: /app/data/buffers
            - name: pipeline-reports
              mountPath: /app/reports
            - name: pipeline-buffer-utils
              mountPath: /app/utils/buffers.py
              subPath: buffers.py
            - name: pipeline-io
              mountPath: /app/utils/pipeline_io.py
              subPath: pipeline_io.py
      volumes:
        - name: pipeline-config
          configMap:
            name: er-pipeline-config
        - name: decision-evaluation-distribution
          configMap:
            name: eaer-decision-evaluation
        - name: pipeline-data
          persistentVolumeClaim:
            claimName: pipeline-data-claim
        - name: pipeline-embedding-model-cache
          persistentVolumeClaim:
            claimName: pipeline-embedding-model-cache-claim
        - name: pipeline-buffer-utils
          configMap:
            name: eaer-kafka-buffers
        - name: pipeline-io
          configMap:
            name: eaer-pipeline-io
        - name: pipeline-buffer-data
          persistentVolumeClaim:
            claimName: pipeline-buffer-data-claim
        - name: pipeline-reports
          persistentVolumeClaim:
            claimName: pipeline-reports-claim
