apiVersion: batch/v1
kind: Job
metadata:
  name: graph-construction
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: graph-construction
    spec:
      restartPolicy: OnFailure
      containers:
        - name: main
          image: __IMAGE_REPOSITORY__:graph
          imagePullPolicy: Always
          command: [/opt/venv/bin/python, /app/entries/worker/graph_construction.py]
          args:
            - --workload
            - ""
          env:
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: pipeline-config
              mountPath: /app/config/examples/config-embedding.yaml
              subPath: config.yaml
            - name: worker-graph-construction
              mountPath: /app/entries/worker/graph_construction.py
              subPath: graph_construction.py
            - name: pipeline-graph-cache
              mountPath: /app/data/graph
            - name: pipeline-buffer-data
              mountPath: /app/data/buffers
            - name: pipeline-io
              mountPath: /app/utils/pipeline_io.py
              subPath: pipeline_io.py
      volumes:
        - name: pipeline-config
          configMap:
            name: er-pipeline-config
        - name: worker-graph-construction
          configMap:
            name: eaer-worker-graph-construction
        - name: pipeline-graph-cache
          persistentVolumeClaim:
            claimName: pipeline-graph-cache-claim
        - name: pipeline-buffer-data
          persistentVolumeClaim:
            claimName: pipeline-buffer-data-claim
        - name: pipeline-io
          configMap:
            name: eaer-pipeline-io
