# Generated into exec/incremental only when the pipeline config sets
# bert_matching.enabled: true (see k8s/scheduling/compiler.py).
apiVersion: batch/v1
kind: Job
metadata:
  name: bert-matching
  labels:
    app: bert-matching
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: bert-matching
    spec:
      restartPolicy: Never
      containers:
        - name: main
          image: __IMAGE_REPOSITORY__:bert
          imagePullPolicy: Always
          command: [/opt/venv/bin/python, /app/entries/worker/bert_matching.py]
          args:
            - --workload
            - ""
          env:
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: pipeline-config
              mountPath: /app/config/examples/config-embedding.yaml
              subPath: config.yaml
            - name: worker-bert-matching
              mountPath: /app/entries/worker/bert_matching.py
              subPath: bert_matching.py
            - name: pipeline-bert-model
              mountPath: /app/data/bert
            - name: pipeline-decision-evaluation-cache
              mountPath: /app/data/predicted
            - name: pipeline-buffer-data
              mountPath: /app/data/buffers
            - name: pipeline-io
              mountPath: /app/utils/pipeline_io.py
              subPath: pipeline_io.py
      volumes:
        - name: pipeline-config
          configMap:
            name: er-pipeline-config
        - name: worker-bert-matching
          configMap:
            name: eaer-worker-bert-matching
        - name: pipeline-bert-model
          persistentVolumeClaim:
            claimName: pipeline-bert-model-claim
        - name: pipeline-decision-evaluation-cache
          persistentVolumeClaim:
            claimName: pipeline-decision-evaluation-cache-claim
        - name: pipeline-io
          configMap:
            name: eaer-pipeline-io
        - name: pipeline-buffer-data
          persistentVolumeClaim:
            claimName: pipeline-buffer-data-claim
