apiVersion: batch/v1
kind: Job
metadata:
  name: random-walk
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: random-walk
    spec:
      restartPolicy: Never
      containers:
        - name: main
          image: __IMAGE_REPOSITORY__:graph
          imagePullPolicy: Always
          command: [/opt/venv/bin/python, /app/entries/worker/random_walk.py]
          args:
            - --workload
            - ""
          env:
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: pipeline-config
              mountPath: /app/config/examples/config-embedding.yaml
              subPath: config.yaml
            - name: worker-random-walk
              mountPath: /app/entries/worker/random_walk.py
              subPath: random_walk.py
            - name: pipeline-graph-cache
              mountPath: /app/data/graph
            - name: pipeline-buffer-data
              mountPath: /app/data/buffers
            - name: pipeline-io
              mountPath: /app/utils/pipeline_io.py
              subPath: pipeline_io.py
      volumes:
        - name: pipeline-config
          configMap:
            name: er-pipeline-config
        - name: worker-random-walk
          configMap:
            name: eaer-worker-random-walk
        - name: pipeline-graph-cache
          persistentVolumeClaim:
            claimName: pipeline-graph-cache-claim
        - name: pipeline-buffer-data
          persistentVolumeClaim:
            claimName: pipeline-buffer-data-claim
        - name: pipeline-io
          configMap:
            name: eaer-pipeline-io
