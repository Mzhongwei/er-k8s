apiVersion: batch/v1
kind: Job
metadata:
  name: embedding-training
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: embedding-training
    spec:
      restartPolicy: OnFailure
      containers:
        - name: main
          image: __IMAGE_REPOSITORY__:embedding
          imagePullPolicy: IfNotPresent
          command: [/opt/venv/bin/python, /app/entries/worker/embedding_training.py]
          args:
            - --workload
            - ""
          env:
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: pipeline-config
              mountPath: /app/config/examples/config-embedding.yaml
              subPath: config.yaml
            - name: worker-embedding-training
              mountPath: /app/entries/worker/embedding_training.py
              subPath: embedding_training.py
            - name: pipeline-embedding-model-cache
              mountPath: /app/data/embedding
            - name: pipeline-buffer-data
              mountPath: /app/data/buffers
            - name: pipeline-io
              mountPath: /app/utils/pipeline_io.py
              subPath: pipeline_io.py
      volumes:
        - name: pipeline-config
          configMap:
            name: er-pipeline-config
        - name: worker-embedding-training
          configMap:
            name: eaer-worker-embedding-training
        - name: pipeline-embedding-model-cache
          persistentVolumeClaim:
            claimName: pipeline-embedding-model-cache-claim
        - name: pipeline-buffer-data
          persistentVolumeClaim:
            claimName: pipeline-buffer-data-claim
        - name: pipeline-io
          configMap:
            name: eaer-pipeline-io
