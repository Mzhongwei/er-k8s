apiVersion: batch/v1
kind: Job
metadata:
  name: cg-feature-extraction
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: cg-feature-extraction
    spec:
      restartPolicy: OnFailure
      containers:
        - name: main
          image: kevinoulai/erctl:cgfeature
          imagePullPolicy: IfNotPresent
          command: [/opt/venv/bin/python, /app/entries/worker/cg_feature_extraction.py]
          args:
            - --workload
            - ""
          env:
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: pipeline-config
              mountPath: /app/config/examples/config-embedding.yaml
              subPath: config.yaml
            - name: worker-cg-feature-extraction
              mountPath: /app/entries/worker/cg_feature_extraction.py
              subPath: cg_feature_extraction.py
            - name: pipeline-io
              mountPath: /app/utils/pipeline_io.py
              subPath: pipeline_io.py
            - name: pipeline-buffer-data
              mountPath: /app/data/buffers
      volumes:
        - name: pipeline-config
          configMap:
            name: er-pipeline-config
        - name: worker-cg-feature-extraction
          configMap:
            name: eaer-worker-cg-feature-extraction
        - name: pipeline-io
          configMap:
            name: eaer-pipeline-io
        - name: pipeline-buffer-data
          persistentVolumeClaim:
            claimName: pipeline-buffer-data-claim
