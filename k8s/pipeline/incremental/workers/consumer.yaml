apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-consumer
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: kafka-consumer
    spec:
      restartPolicy: Never
      serviceAccountName: argo
      containers:
        - name: main
          image: __IMAGE_REPOSITORY__:kafka
          imagePullPolicy: Always
          command: [python, /app/consumer.py]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: pipeline-kafka-consumer
              mountPath: /app/consumer.py
              subPath: consumer.py
            - name: pipeline-config
              mountPath: /app/config/examples/config-embedding.yaml
              subPath: config.yaml
            - name: pipeline-buffer-data
              mountPath: /app/data/buffers
            - name: pipeline-io
              mountPath: /app/utils/pipeline_io.py
              subPath: pipeline_io.py
      volumes:
        - name: pipeline-buffer-data
          persistentVolumeClaim:
            claimName: pipeline-buffer-data-claim
        - name: pipeline-kafka-consumer
          configMap:
            name: eaer-kafka-consumer
        - name: pipeline-config
          configMap:
            name: er-pipeline-config
        - name: pipeline-io
          configMap:
            name: eaer-pipeline-io
