apiVersion: batch/v1
kind: Job
metadata:
  name: incremental-init
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: incremental-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: main
          image: __IMAGE_REPOSITORY__:config
          imagePullPolicy: IfNotPresent
          command: [sh, /app/incremental_init.sh]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: incremental-init-script
              mountPath: /app/incremental_init.sh
              subPath: incremental_init.sh
            - name: pipeline-buffer-data
              mountPath: /app/data/buffers
      volumes:
        - name: incremental-init-script
          configMap:
            name: eaer-incremental-init
        - name: pipeline-buffer-data
          persistentVolumeClaim:
            claimName: pipeline-buffer-data-claim
