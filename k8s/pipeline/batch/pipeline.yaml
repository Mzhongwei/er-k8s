apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: pipeline-
  namespace: argo
spec:
  serviceAccountName: argo
  archiveLogs: false

  podGC:
    strategy: OnWorkflowCompletion
    deleteDelayDuration: 30m
  ttlStrategy:
    secondsAfterSuccess: 3600 # 1 hour
    secondsAfterFailure: 86400 # 1 day
  arguments:
    parameters:
    - name: mode
      value: embedding-training
    # Dataset paths are intentionally not workflow parameters. The active entries/batch
    # scripts read data_source_A/trainset_path/evalset_path/testset_path from config.yaml.
  entrypoint: main

  templates:
    - name: normalization
      retryStrategy:
        limit: 0
      container:
        name: main
        image: __IMAGE_REPOSITORY__:embedding-training
        imagePullPolicy: Always
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        command:
        - /opt/venv/bin/python
        - /app/entries/batch/EmbTrai-training.py
        args:
        - --stage
        - normalization
        - --workload
        - '{{workflow.name}}'
        volumeMounts:
        - name: pipeline-config
          mountPath: /app/config/examples/config-embedding.yaml
          subPath: config.yaml
        - name: training-entry
          mountPath: /app/entries/batch/EmbTrai-training.py
          subPath: EmbTrai-training.py
        - name: pipeline-communication
          mountPath: /app/data
        - name: pipeline-io
          mountPath: /app/utils/pipeline_io.py
          subPath: pipeline_io.py
        - name: pipeline-data
          mountPath: /data
          readOnly: true
      volumes:
      - name: pipeline-config
        configMap:
          name: er-pipeline-config
      - name: training-entry
        configMap:
          name: eaer-batch-windowed-embedding-training
      - name: pipeline-communication
        persistentVolumeClaim:
          claimName: pipeline-communication-claim
      - name: pipeline-io
        configMap:
          name: eaer-pipeline-io
      - name: pipeline-data
        persistentVolumeClaim:
          claimName: pipeline-data-claim
          readOnly: true

    - name: graph-construction
      retryStrategy:
        limit: 0
      container:
        name: main
        image: __IMAGE_REPOSITORY__:embedding-training
        imagePullPolicy: Always
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: "2"
            memory: 4Gi
        command:
        - /opt/venv/bin/python
        - /app/entries/batch/EmbTrai-training.py
        args:
        - --stage
        - graph-construction
        - --workload
        - '{{workflow.name}}'
        volumeMounts:
        - name: pipeline-config
          mountPath: /app/config/examples/config-embedding.yaml
          subPath: config.yaml
        - name: training-entry
          mountPath: /app/entries/batch/EmbTrai-training.py
          subPath: EmbTrai-training.py
        - name: pipeline-communication
          mountPath: /app/data
        - name: pipeline-io
          mountPath: /app/utils/pipeline_io.py
          subPath: pipeline_io.py
        - name: pipeline-graph-cache
          mountPath: /app/data/graph
      volumes:
      - name: pipeline-config
        configMap:
          name: er-pipeline-config
      - name: training-entry
        configMap:
          name: eaer-batch-windowed-embedding-training
      - name: pipeline-communication
        persistentVolumeClaim:
          claimName: pipeline-communication-claim
      - name: pipeline-io
        configMap:
          name: eaer-pipeline-io
      - name: pipeline-graph-cache
        persistentVolumeClaim:
          claimName: pipeline-graph-cache-claim

    - name: random-walk
      retryStrategy:
        limit: 0
      container:
        name: main
        image: __IMAGE_REPOSITORY__:embedding-training
        imagePullPolicy: Always
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: "2"
            memory: 4Gi
        command:
        - /opt/venv/bin/python
        - /app/entries/batch/EmbTrai-training.py
        args:
        - --stage
        - random-walk
        - --workload
        - '{{workflow.name}}'
        volumeMounts:
        - name: pipeline-config
          mountPath: /app/config/examples/config-embedding.yaml
          subPath: config.yaml
        - name: training-entry
          mountPath: /app/entries/batch/EmbTrai-training.py
          subPath: EmbTrai-training.py
        - name: pipeline-communication
          mountPath: /app/data
        - name: pipeline-io
          mountPath: /app/utils/pipeline_io.py
          subPath: pipeline_io.py
      volumes:
      - name: pipeline-config
        configMap:
          name: er-pipeline-config
      - name: training-entry
        configMap:
          name: eaer-batch-windowed-embedding-training
      - name: pipeline-communication
        persistentVolumeClaim:
          claimName: pipeline-communication-claim
      - name: pipeline-io
        configMap:
          name: eaer-pipeline-io

    - name: embedding-training
      retryStrategy:
        limit: 0
      container:
        name: main
        image: __IMAGE_REPOSITORY__:embedding-training
        imagePullPolicy: Always
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: "2"
            memory: 2Gi
        command:
        - /opt/venv/bin/python
        - /app/entries/batch/EmbTrai-training.py
        args:
        - --stage
        - embedding-training
        - --workload
        - '{{workflow.name}}'
        volumeMounts:
        - name: pipeline-config
          mountPath: /app/config/examples/config-embedding.yaml
          subPath: config.yaml
        - name: training-entry
          mountPath: /app/entries/batch/EmbTrai-training.py
          subPath: EmbTrai-training.py
        - name: pipeline-communication
          mountPath: /app/data
        - name: pipeline-io
          mountPath: /app/utils/pipeline_io.py
          subPath: pipeline_io.py
        - name: pipeline-embedding-model-cache
          mountPath: /app/data/embedding
      volumes:
      - name: pipeline-config
        configMap:
          name: er-pipeline-config
      - name: training-entry
        configMap:
          name: eaer-batch-windowed-embedding-training
      - name: pipeline-communication
        persistentVolumeClaim:
          claimName: pipeline-communication-claim
      - name: pipeline-io
        configMap:
          name: eaer-pipeline-io
      - name: pipeline-embedding-model-cache
        persistentVolumeClaim:
          claimName: pipeline-embedding-model-cache-claim

    - name: cg-feature-extraction
      retryStrategy:
        limit: 0
      container:
        name: main
        image: __IMAGE_REPOSITORY__:embedding-training
        imagePullPolicy: Always
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        command:
        - /opt/venv/bin/python
        - /app/entries/batch/EmbTrai-training.py
        args:
        - --stage
        - cg-feature-extraction
        - --workload
        - '{{workflow.name}}'
        volumeMounts:
        - name: pipeline-config
          mountPath: /app/config/examples/config-embedding.yaml
          subPath: config.yaml
        - name: training-entry
          mountPath: /app/entries/batch/EmbTrai-training.py
          subPath: EmbTrai-training.py
        - name: pipeline-communication
          mountPath: /app/data
        - name: pipeline-io
          mountPath: /app/utils/pipeline_io.py
          subPath: pipeline_io.py
      volumes:
      - name: pipeline-config
        configMap:
          name: er-pipeline-config
      - name: training-entry
        configMap:
          name: eaer-batch-windowed-embedding-training
      - name: pipeline-communication
        persistentVolumeClaim:
          claimName: pipeline-communication-claim
      - name: pipeline-io
        configMap:
          name: eaer-pipeline-io

    - name: feature-index-construction
      retryStrategy:
        limit: 0
      container:
        name: main
        image: __IMAGE_REPOSITORY__:embedding-training
        imagePullPolicy: Always
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        command:
        - /opt/venv/bin/python
        - /app/entries/batch/EmbTrai-training.py
        args:
        - --stage
        - feature-index-construction
        - --workload
        - '{{workflow.name}}'
        volumeMounts:
        - name: pipeline-config
          mountPath: /app/config/examples/config-embedding.yaml
          subPath: config.yaml
        - name: training-entry
          mountPath: /app/entries/batch/EmbTrai-training.py
          subPath: EmbTrai-training.py
        - name: pipeline-communication
          mountPath: /app/data
        - name: pipeline-io
          mountPath: /app/utils/pipeline_io.py
          subPath: pipeline_io.py
        - name: pipeline-feature-index-cache
          mountPath: /app/data/index
      volumes:
      - name: pipeline-config
        configMap:
          name: er-pipeline-config
      - name: training-entry
        configMap:
          name: eaer-batch-windowed-embedding-training
      - name: pipeline-communication
        persistentVolumeClaim:
          claimName: pipeline-communication-claim
      - name: pipeline-io
        configMap:
          name: eaer-pipeline-io
      - name: pipeline-feature-index-cache
        persistentVolumeClaim:
          claimName: pipeline-feature-index-cache-claim

    - name: berttrai-normalization
      container:
        name: main
        image: __IMAGE_REPOSITORY__:normalization
        imagePullPolicy: Always
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: "2"
            memory: 4Gi
        command: [/opt/venv/bin/python, /app/entries/batch/BertTrai-normalization.py]
        args:
        - --workload
        - '{{workflow.name}}'
        volumeMounts:
        - name: pipeline-config
          mountPath: /app/config/examples/config-bert.yaml
          subPath: config.yaml
        - name: berttrai-normalization
          mountPath: /app/entries/batch/BertTrai-normalization.py
          subPath: BertTrai-normalization.py
        - name: pipeline-data
          mountPath: /data
          readOnly: true
        - name: pipeline-communication
          mountPath: /app/data
        - name: pipeline-io
          mountPath: /app/utils/pipeline_io.py
          subPath: pipeline_io.py
      volumes:
      - name: pipeline-config
        configMap:
          name: er-pipeline-config
      - name: berttrai-normalization
        configMap:
          name: eaer-batch-berttrai-normalization
      - name: pipeline-data
        persistentVolumeClaim:
          claimName: pipeline-data-claim
          readOnly: true
      - name: pipeline-communication
        persistentVolumeClaim:
          claimName: pipeline-communication-claim
      - name: pipeline-io
        configMap:
          name: eaer-pipeline-io

    - name: berttrai-training
      container:
        name: main
        image: __IMAGE_REPOSITORY__:bert
        imagePullPolicy: Always
        resources:
          requests:
            cpu: "2"
            memory: 4Gi
            nvidia.com/gpu: 1
          limits:
            cpu: "4"
            memory: 16Gi
            nvidia.com/gpu: 1
        command: [/opt/venv/bin/python, /app/entries/batch/BertTrai_training.py]
        args:
        - --workload
        - '{{workflow.name}}'
        volumeMounts:
        - name: pipeline-config
          mountPath: /app/config/examples/config-bert.yaml
          subPath: config.yaml
        - name: berttrai-training
          mountPath: /app/entries/batch/BertTrai_training.py
          subPath: BertTrai_training.py
        - name: bert-training
          mountPath: /app/pipeline/bert_training.py
          subPath: bert_training.py
        - name: pipeline-bert-model
          mountPath: /app/data/bert
        - name: pipeline-communication
          mountPath: /app/data
        - name: pipeline-io
          mountPath: /app/utils/pipeline_io.py
          subPath: pipeline_io.py
      volumes:
      - name: pipeline-config
        configMap:
          name: er-pipeline-config
      - name: berttrai-training
        configMap:
          name: eaer-batch-berttrai-training
      - name: bert-training
        configMap:
          name: eaer-bert-training
      - name: pipeline-bert-model
        persistentVolumeClaim:
          claimName: pipeline-bert-model-claim
      - name: pipeline-communication
        persistentVolumeClaim:
          claimName: pipeline-communication-claim
      - name: pipeline-io
        configMap:
          name: eaer-pipeline-io

    - name: berteva-normalization
      container:
        name: main
        image: __IMAGE_REPOSITORY__:normalization
        imagePullPolicy: Always
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: "2"
            memory: 4Gi
        command: [/opt/venv/bin/python, /app/entries/batch/BertEva-normalization.py]
        args:
        - --workload
        - '{{workflow.name}}'
        volumeMounts:
        - name: pipeline-config
          mountPath: /app/config/examples/config-bert.yaml
          subPath: config.yaml
        - name: berteva-normalization
          mountPath: /app/entries/batch/BertEva-normalization.py
          subPath: BertEva-normalization.py
        - name: pipeline-data
          mountPath: /data
          readOnly: true
        - name: pipeline-communication
          mountPath: /app/data
        - name: pipeline-io
          mountPath: /app/utils/pipeline_io.py
          subPath: pipeline_io.py
      volumes:
      - name: pipeline-config
        configMap:
          name: er-pipeline-config
      - name: berteva-normalization
        configMap:
          name: eaer-batch-berteva-normalization
      - name: pipeline-data
        persistentVolumeClaim:
          claimName: pipeline-data-claim
          readOnly: true
      - name: pipeline-communication
        persistentVolumeClaim:
          claimName: pipeline-communication-claim
      - name: pipeline-io
        configMap:
          name: eaer-pipeline-io

    - name: berteva-b-evaluation
      container:
        name: main
        image: __IMAGE_REPOSITORY__:bert
        imagePullPolicy: Always
        resources:
          requests:
            cpu: "1"
            memory: 2Gi
            nvidia.com/gpu: 1
          limits:
            cpu: "4"
            memory: 8Gi
            nvidia.com/gpu: 1
        command: [/opt/venv/bin/python, /app/entries/batch/BertEva-b_evaluation.py]
        args:
        - --workload
        - '{{workflow.name}}'
        volumeMounts:
        - name: pipeline-config
          mountPath: /app/config/examples/config-bert.yaml
          subPath: config.yaml
        - name: berteva-b-evaluation
          mountPath: /app/entries/batch/BertEva-b_evaluation.py
          subPath: BertEva-b_evaluation.py
        - name: pipeline-bert-model
          mountPath: /app/data/bert
        - name: pipeline-communication
          mountPath: /app/data
        - name: pipeline-io
          mountPath: /app/utils/pipeline_io.py
          subPath: pipeline_io.py
      volumes:
      - name: pipeline-config
        configMap:
          name: er-pipeline-config
      - name: berteva-b-evaluation
        configMap:
          name: eaer-batch-berteva-b-evaluation
      - name: pipeline-bert-model
        persistentVolumeClaim:
          claimName: pipeline-bert-model-claim
      - name: pipeline-communication
        persistentVolumeClaim:
          claimName: pipeline-communication-claim
      - name: pipeline-io
        configMap:
          name: eaer-pipeline-io

    - name: embedding-training-dag
      dag:
        tasks:
        # Start persistent stage workers together; file handoffs enforce data dependencies.
        # A Succeeded dependency would deadlock producers waiting for downstream ACKs.
        - name: normalization
          template: normalization
        - name: graph-construction
          template: graph-construction
        - name: random-walk
          template: random-walk
        - name: embedding-training
          template: embedding-training
        - name: cg-feature-extraction
          template: cg-feature-extraction
        - name: feature-index-construction
          template: feature-index-construction

    - name: bert-training-evaluation-dag
      dag:
        tasks:
        - name: bert-normalization-training
          template: berttrai-normalization

        - name: bert-training
          depends: bert-normalization-training.Succeeded
          template: berttrai-training

        - name: bert-normalization-b-evaluation
          depends: bert-training.Succeeded
          template: berteva-normalization

        - name: bert-evaluation
          depends: bert-normalization-b-evaluation.Succeeded
          template: berteva-b-evaluation

    - name: main
      dag:
        # This workflow only trains (embedding or BERT). Prediction and evaluation for the
        # embedding mode run as the incremental worker Jobs (k8s/pipeline/incremental/), which
        # pipeline.sh applies after this workflow succeeds; there is no separate batch
        # prediction branch. An embedding mode without "training" (e.g. "embedding-inference")
        # therefore matches neither branch below and this workflow runs zero tasks.
        tasks:
        - name: embedding-training-dag
          when: "'{{workflow.parameters.mode}}' =~ '.*embedding.*' && '{{workflow.parameters.mode}}' =~ '.*training.*'"
          template: embedding-training-dag

        - name: bert-training-evaluation-dag
          when: "'{{workflow.parameters.mode}}' =~ '.*bert.*'"
          template: bert-training-evaluation-dag
