apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: pipeline-
  namespace: argo
spec:
  serviceAccountName: argo
  archiveLogs: false

  podGC:
    strategy: OnWorkflowCompletion
    deleteDelayDuration: 30m
  ttlStrategy:
    secondsAfterSuccess: 3600 # 1 hour
    secondsAfterFailure: 86400 # 1 day
  arguments:
    parameters:
    - name: mode
      value: embedding-training
    # Dataset paths are intentionally not workflow parameters. The active entries/batch
    # scripts read data_source_A/trainset_path/evalset_path/testset_path from config.yaml.
  entrypoint: main

  templates:
    - name: windowed-embedding-training
      container:
        name: main
        image: __IMAGE_REPOSITORY__:embedding-training
        imagePullPolicy: Always
        command: [/opt/venv/bin/python, /app/entries/batch/EmbTrai-training.py]
        volumeMounts:
        - name: pipeline-config
          mountPath: /app/config/examples/config-embedding.yaml
          subPath: config.yaml
        - name: windowed-embedding-training
          mountPath: /app/entries/batch/EmbTrai-training.py
          subPath: EmbTrai-training.py
        - name: pipeline-data
          mountPath: /data
          readOnly: true
        - name: pipeline-graph-cache
          mountPath: /app/data/graph
        - name: pipeline-embedding-model-cache
          mountPath: /app/data/embedding
        - name: pipeline-feature-index-cache
          mountPath: /app/data/index
        - name: pipeline-communication
          mountPath: /app/data
        - name: pipeline-io
          mountPath: /app/utils/pipeline_io.py
          subPath: pipeline_io.py
      volumes:
      - name: pipeline-config
        configMap:
          name: er-pipeline-config
      - name: windowed-embedding-training
        configMap:
          name: eaer-batch-windowed-embedding-training
      - name: pipeline-data
        persistentVolumeClaim:
          claimName: pipeline-data-claim
          readOnly: true
      - name: pipeline-graph-cache
        persistentVolumeClaim:
          claimName: pipeline-graph-cache-claim
      - name: pipeline-embedding-model-cache
        persistentVolumeClaim:
          claimName: pipeline-embedding-model-cache-claim
      - name: pipeline-feature-index-cache
        persistentVolumeClaim:
          claimName: pipeline-feature-index-cache-claim
      - name: pipeline-communication
        persistentVolumeClaim:
          claimName: pipeline-communication-claim
      - name: pipeline-io
        configMap:
          name: eaer-pipeline-io

    - name: berttrai-normalization
      container:
        name: main
        image: __IMAGE_REPOSITORY__:normalization
        imagePullPolicy: Always
        command: [/opt/venv/bin/python, /app/entries/batch/BertTrai-normalization.py]
        args:
        - --workload
        - '{{workflow.name}}'
        volumeMounts:
        - name: pipeline-config
          mountPath: /app/config/examples/config-bert.yaml
          subPath: config.yaml
        - name: berttrai-normalization
          mountPath: /app/entries/batch/BertTrai-normalization.py
          subPath: BertTrai-normalization.py
        - name: pipeline-data
          mountPath: /data
          readOnly: true
        - name: pipeline-communication
          mountPath: /app/data
        - name: pipeline-io
          mountPath: /app/utils/pipeline_io.py
          subPath: pipeline_io.py
      volumes:
      - name: pipeline-config
        configMap:
          name: er-pipeline-config
      - name: berttrai-normalization
        configMap:
          name: eaer-batch-berttrai-normalization
      - name: pipeline-data
        persistentVolumeClaim:
          claimName: pipeline-data-claim
          readOnly: true
      - name: pipeline-communication
        persistentVolumeClaim:
          claimName: pipeline-communication-claim
      - name: pipeline-io
        configMap:
          name: eaer-pipeline-io

    - name: berttrai-training
      container:
        name: main
        image: __IMAGE_REPOSITORY__:bert
        imagePullPolicy: Always
        resources:
          limits:
            nvidia.com/gpu: 1
        command: [/opt/venv/bin/python, /app/entries/batch/BertTrai_training.py]
        args:
        - --workload
        - '{{workflow.name}}'
        volumeMounts:
        - name: pipeline-config
          mountPath: /app/config/examples/config-bert.yaml
          subPath: config.yaml
        - name: berttrai-training
          mountPath: /app/entries/batch/BertTrai_training.py
          subPath: BertTrai_training.py
        - name: bert-training
          mountPath: /app/pipeline/bert_training.py
          subPath: bert_training.py
        - name: pipeline-bert-model
          mountPath: /app/data/bert
        - name: pipeline-communication
          mountPath: /app/data
        - name: pipeline-io
          mountPath: /app/utils/pipeline_io.py
          subPath: pipeline_io.py
      volumes:
      - name: pipeline-config
        configMap:
          name: er-pipeline-config
      - name: berttrai-training
        configMap:
          name: eaer-batch-berttrai-training
      - name: bert-training
        configMap:
          name: eaer-bert-training
      - name: pipeline-bert-model
        persistentVolumeClaim:
          claimName: pipeline-bert-model-claim
      - name: pipeline-communication
        persistentVolumeClaim:
          claimName: pipeline-communication-claim
      - name: pipeline-io
        configMap:
          name: eaer-pipeline-io

    - name: berteva-normalization
      container:
        name: main
        image: __IMAGE_REPOSITORY__:normalization
        imagePullPolicy: Always
        command: [/opt/venv/bin/python, /app/entries/batch/BertEva-normalization.py]
        args:
        - --workload
        - '{{workflow.name}}'
        volumeMounts:
        - name: pipeline-config
          mountPath: /app/config/examples/config-bert.yaml
          subPath: config.yaml
        - name: berteva-normalization
          mountPath: /app/entries/batch/BertEva-normalization.py
          subPath: BertEva-normalization.py
        - name: pipeline-data
          mountPath: /data
          readOnly: true
        - name: pipeline-communication
          mountPath: /app/data
        - name: pipeline-io
          mountPath: /app/utils/pipeline_io.py
          subPath: pipeline_io.py
      volumes:
      - name: pipeline-config
        configMap:
          name: er-pipeline-config
      - name: berteva-normalization
        configMap:
          name: eaer-batch-berteva-normalization
      - name: pipeline-data
        persistentVolumeClaim:
          claimName: pipeline-data-claim
          readOnly: true
      - name: pipeline-communication
        persistentVolumeClaim:
          claimName: pipeline-communication-claim
      - name: pipeline-io
        configMap:
          name: eaer-pipeline-io

    - name: berteva-b-evaluation
      container:
        name: main
        image: __IMAGE_REPOSITORY__:bert
        imagePullPolicy: Always
        resources:
          limits:
            nvidia.com/gpu: 1
        command: [/opt/venv/bin/python, /app/entries/batch/BertEva-b_evaluation.py]
        args:
        - --workload
        - '{{workflow.name}}'
        volumeMounts:
        - name: pipeline-config
          mountPath: /app/config/examples/config-bert.yaml
          subPath: config.yaml
        - name: berteva-b-evaluation
          mountPath: /app/entries/batch/BertEva-b_evaluation.py
          subPath: BertEva-b_evaluation.py
        - name: pipeline-bert-model
          mountPath: /app/data/bert
        - name: pipeline-communication
          mountPath: /app/data
        - name: pipeline-io
          mountPath: /app/utils/pipeline_io.py
          subPath: pipeline_io.py
      volumes:
      - name: pipeline-config
        configMap:
          name: er-pipeline-config
      - name: berteva-b-evaluation
        configMap:
          name: eaer-batch-berteva-b-evaluation
      - name: pipeline-bert-model
        persistentVolumeClaim:
          claimName: pipeline-bert-model-claim
      - name: pipeline-communication
        persistentVolumeClaim:
          claimName: pipeline-communication-claim
      - name: pipeline-io
        configMap:
          name: eaer-pipeline-io

    - name: embedding-training-dag
      dag:
        tasks:
        - name: embedding-training
          template: windowed-embedding-training

    - name: bert-training-evaluation-dag
      dag:
        tasks:
        - name: bert-normalization-training
          template: berttrai-normalization

        - name: bert-training
          depends: bert-normalization-training.Succeeded
          template: berttrai-training

        - name: bert-normalization-b-evaluation
          depends: bert-training.Succeeded
          template: berteva-normalization

        - name: bert-evaluation
          depends: bert-normalization-b-evaluation.Succeeded
          template: berteva-b-evaluation

    - name: main
      dag:
        # TODO(EmbPred): a third branch for batch embedding prediction/evaluation is not
        # built yet. It should mount entries/batch/EmbPred-*.py (9 scripts: normalization,
        # graph_construction, random_walk, cg_feature_extraction, embedding_training
        # (continues the batch-trained model on prediction-side sequences),
        # candidate_enumeration, calculating_similarity, decision_making, evaluation) the
        # same way embedding-training-dag/bert-training-evaluation-dag mount their scripts,
        # then get a task here gated on mode =~ '.*embedding.*' && mode =~ '.*inference.*'
        # (or '.*evaluation.*', matching config-embedding.yaml's
        # "embedding-training-inference-evaluation"). Until then, an embedding mode with
        # "inference" or "evaluation" but without "training" (e.g. "embedding-inference" or
        # "embedding-evaluation" on their own) matches neither branch below and the workflow
        # runs zero tasks. This file's own default ("embedding-training") does match the
        # embedding-training-dag branch.
        tasks:
        - name: embedding-training-dag
          when: "'{{workflow.parameters.mode}}' =~ '.*embedding.*' && '{{workflow.parameters.mode}}' =~ '.*training.*'"
          template: embedding-training-dag

        - name: bert-training-evaluation-dag
          when: "'{{workflow.parameters.mode}}' =~ '.*bert.*'"
          template: bert-training-evaluation-dag
