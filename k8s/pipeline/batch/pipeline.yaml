apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: pipeline-
  namespace: argo
spec:
  serviceAccountName: argo
  imagePullSecrets:
  - name: regcred

  podGC:
    strategy: OnWorkflowCompletion
    deleteDelayDuration: 30m
  ttlStrategy:
    secondsAfterSuccess: 3600 # 1 hour
    secondsAfterFailure: 86400 # 1 day
  artifactGC:
    strategy: OnWorkflowCompletion
  arguments:
    parameters:
    - name: mode
      value: embedding-evaluation
    - name: raw_data
      value: /data/exp_datasets/4-1_dirty_dblp_acm/tableA.csv
    - name: data_source_A
      value: /data/exp_datasets/4-1_dirty_dblp_acm/tableA.csv
    - name: data_source_B
      value: /data/exp_datasets/4-1_dirty_dblp_acm/tableB.csv
  entrypoint: main

  templates:
    - name: normalization
      inputs:
        parameters:
        - name: mode
        - name: raw_data
        - name: data_source_A
        - name: data_source_B
        - name: function
        - name: output_path
      container:
        name: main
        image: kevinoulai/erctl:normalization
        imagePullPolicy: Always
        command: [sh, -c]
        args:
        - |
          /opt/venv/bin/python /app/distributions/normalization_distribution.py --mode '{{inputs.parameters.mode}}' --function '{{inputs.parameters.function}}' --raw_data '{{inputs.parameters.raw_data}}' --data_source_A '{{inputs.parameters.data_source_A}}' --data_source_B '{{inputs.parameters.data_source_B}}' --output '{{inputs.parameters.output_path}}'
        env:
        - name: MODE
          value: '{{inputs.parameters.mode}}'
        - name: WORKFLOW_NAME
          value: '{{workflow.name}}'
        volumeMounts:
        - name: pipeline-config
          mountPath: /app/config/examples/config-embedding.yaml
          subPath: config.yaml
        - name: normalization-distribution
          mountPath: /app/distributions/normalization_distribution.py
          subPath: normalization_distribution.py
        - name: pipeline-data
          mountPath: /data
        - name: pipeline-buffer-data
          mountPath: /app/data/buffers
        - name: pipeline-reports
          mountPath: /app/reports
        - name: pipeline-buffer-utils
          mountPath: /app/utils/buffers.py
          subPath: buffers.py
        - name: pipeline-io
          mountPath: /app/utils/pipeline_io.py
          subPath: pipeline_io.py
      volumes:
      - name: pipeline-config
        configMap:
          name: er-pipeline-config
      - name: normalization-distribution
        configMap:
          name: eaer-normalization-distribution
      - name: pipeline-data
        persistentVolumeClaim:
          claimName: pipeline-data-claim
      - name: pipeline-buffer-data
        persistentVolumeClaim:
          claimName: pipeline-buffer-data-claim
      - name: pipeline-reports
        persistentVolumeClaim:
          claimName: pipeline-reports-claim
      - name: pipeline-buffer-utils
        configMap:
          name: eaer-kafka-buffers
      - name: pipeline-io
        configMap:
          name: eaer-pipeline-io

    - name: graph
      inputs:
        parameters:
        - name: mode
        - name: function
        - name: processed_data
        - name: output_path
      container:
        name: main
        image: kevinoulai/erctl:graph
        imagePullPolicy: Always
        command: [/opt/venv/bin/python, /app/distributions/graph_randomwalk.py]
        args:
        - --processed_data
        - '{{inputs.parameters.processed_data}}'
        - --mode
        - '{{inputs.parameters.mode}}'
        - --function
        - '{{inputs.parameters.function}}'
        - --output
        - '{{inputs.parameters.output_path}}'
        env:
        - name: WORKFLOW_NAME
          value: '{{workflow.name}}'
        volumeMounts:
        - name: pipeline-config
          mountPath: /app/config/examples/config-embedding.yaml
          subPath: config.yaml
        - name: graph-distribution
          mountPath: /app/distributions/graph_randomwalk.py
          subPath: graph_randomwalk.py
        - name: pipeline-graph-cache
          mountPath: /app/data
        - name: pipeline-buffer-data
          mountPath: /app/data/buffers
        - name: pipeline-reports
          mountPath: /app/reports
        - name: pipeline-buffer-utils
          mountPath: /app/utils/buffers.py
          subPath: buffers.py
        - name: pipeline-io
          mountPath: /app/utils/pipeline_io.py
          subPath: pipeline_io.py
      volumes:
      - name: pipeline-config
        configMap:
          name: er-pipeline-config
      - name: graph-distribution
        configMap:
          name: eaer-graph-distribution
      - name: pipeline-graph-cache
        persistentVolumeClaim:
          claimName: pipeline-graph-cache-claim
      - name: pipeline-buffer-data
        persistentVolumeClaim:
          claimName: pipeline-buffer-data-claim
      - name: pipeline-reports
        persistentVolumeClaim:
          claimName: pipeline-reports-claim
      - name: pipeline-buffer-utils
        configMap:
          name: eaer-kafka-buffers
      - name: pipeline-io
        configMap:
          name: eaer-pipeline-io

    - name: embedding
      inputs:
        parameters:
        - name: mode
        - name: function
        - name: sequences
        - name: candidate_pairs
        - name: output_path
      container:
        name: main
        image: kevinoulai/erctl:embedding
        imagePullPolicy: Always
        command: [/opt/venv/bin/python, /app/distributions/embedding_training_entry.py]
        args:
        - --mode
        - '{{inputs.parameters.mode}}'
        - --sequences
        - '{{inputs.parameters.sequences}}'
        - --output
        - '{{inputs.parameters.output_path}}'
        env:
        - name: WORKFLOW_NAME
          value: '{{workflow.name}}'
        volumeMounts:
        - name: pipeline-config
          mountPath: /app/config/examples/config-embedding.yaml
          subPath: config.yaml
        - name: embedding-training-entry
          mountPath: /app/distributions/embedding_training_entry.py
          subPath: embedding_training_entry.py
        - name: embedding-common
          mountPath: /app/distributions/embedding_common.py
          subPath: embedding_common.py
        - name: pipeline-embedding-model-cache
          mountPath: /app/data
        - name: pipeline-buffer-data
          mountPath: /app/data/buffers
        - name: pipeline-reports
          mountPath: /app/reports
        - name: pipeline-buffer-utils
          mountPath: /app/utils/buffers.py
          subPath: buffers.py
        - name: pipeline-io
          mountPath: /app/utils/pipeline_io.py
          subPath: pipeline_io.py
        - name: config-io
          mountPath: /app/utils/config_io.py
          subPath: config_io.py
        - name: embedding-state
          mountPath: /app/state_io
      volumes:
      - name: pipeline-config
        configMap:
          name: er-pipeline-config
      - name: embedding-training-entry
        configMap:
          name: eaer-embedding-training-entry
      - name: embedding-common
        configMap:
          name: eaer-embedding-common
      - name: pipeline-embedding-model-cache
        persistentVolumeClaim:
          claimName: pipeline-embedding-model-cache-claim
      - name: pipeline-buffer-data
        persistentVolumeClaim:
          claimName: pipeline-buffer-data-claim
      - name: pipeline-buffer-utils
        configMap:
          name: eaer-kafka-buffers
      - name: pipeline-io
        configMap:
          name: eaer-pipeline-io
      - name: config-io
        configMap:
          name: eaer-config-io
      - name: embedding-state
        configMap:
          name: eaer-embedding-state
      - name: pipeline-reports
        persistentVolumeClaim:
          claimName: pipeline-reports-claim

    - name: cg-feature-extraction
      inputs:
        parameters:
        - name: mode
        - name: function
        - name: processed_data
        - name: output_path
      container:
        name: main
        image: kevinoulai/erctl:cgfeature
        imagePullPolicy: IfNotPresent
        command: [/opt/venv/bin/python, /app/distributions/cg_feature_distribution.py]
        args:
        - --mode
        - '{{inputs.parameters.mode}}'
        - --processed_data
        - '{{inputs.parameters.processed_data}}'
        - --output
        - '{{inputs.parameters.output_path}}'
        - --function
        - '{{inputs.parameters.function}}'
        env:
        - name: WORKFLOW_NAME
          value: '{{workflow.name}}'
        volumeMounts:
        - name: pipeline-config
          mountPath: /app/config/examples/config-embedding.yaml
          subPath: config.yaml
        - name: cg-feature-distribution
          mountPath: /app/distributions/cg_feature_distribution.py
          subPath: cg_feature_distribution.py
        - name: pipeline-buffer-utils
          mountPath: /app/utils/buffers.py
          subPath: buffers.py
        - name: pipeline-io
          mountPath: /app/utils/pipeline_io.py
          subPath: pipeline_io.py
        - name: pipeline-buffer-data
          mountPath: /app/data/buffers
        - name: pipeline-reports
          mountPath: /app/reports
      volumes:
      - name: pipeline-config
        configMap:
          name: er-pipeline-config
      - name: cg-feature-distribution
        configMap:
          name: eaer-cg-feature-distribution
      - name: pipeline-buffer-utils
        configMap:
          name: eaer-kafka-buffers
      - name: pipeline-io
        configMap:
          name: eaer-pipeline-io
      - name: pipeline-buffer-data
        persistentVolumeClaim:
          claimName: pipeline-buffer-data-claim
      - name: pipeline-reports
        persistentVolumeClaim:
          claimName: pipeline-reports-claim

    - name: feature-index
      inputs:
        parameters:
        - name: mode
        - name: function
        - name: cg_feature
        - name: output_path
      container:
        name: main
        image: kevinoulai/erctl:featureindex
        imagePullPolicy: IfNotPresent
        command: [/opt/venv/bin/python, /app/distributions/featureindex_candidate.py]
        args:
        - --cg_feature
        - '{{inputs.parameters.cg_feature}}'
        - --mode
        - '{{inputs.parameters.mode}}'
        - --function
        - '{{inputs.parameters.function}}'
        - --output
        - '{{inputs.parameters.output_path}}'
        env:
        - name: WORKFLOW_NAME
          value: '{{workflow.name}}'
        volumeMounts:
        - name: pipeline-config
          mountPath: /app/config/examples/config-embedding.yaml
          subPath: config.yaml
        - name: feature-index-distribution
          mountPath: /app/distributions/featureindex_candidate.py
          subPath: featureindex_candidate.py
        - name: pipeline-feature-index-cache
          mountPath: /app/data
        - name: pipeline-buffer-data
          mountPath: /app/data/buffers
        - name: pipeline-reports
          mountPath: /app/reports
        - name: pipeline-buffer-utils
          mountPath: /app/utils/buffers.py
          subPath: buffers.py
        - name: pipeline-io
          mountPath: /app/utils/pipeline_io.py
          subPath: pipeline_io.py
      volumes:
      - name: pipeline-config
        configMap:
          name: er-pipeline-config
      - name: feature-index-distribution
        configMap:
          name: eaer-feature-index
      - name: pipeline-feature-index-cache
        persistentVolumeClaim:
          claimName: pipeline-feature-index-cache-claim
      - name: pipeline-buffer-utils
        configMap:
          name: eaer-kafka-buffers
      - name: pipeline-io
        configMap:
          name: eaer-pipeline-io
      - name: pipeline-buffer-data
        persistentVolumeClaim:
          claimName: pipeline-buffer-data-claim
      - name: pipeline-reports
        persistentVolumeClaim:
          claimName: pipeline-reports-claim

    - name: bert
      inputs:
        parameters:
        - name: mode
        - name: function
        - name: processed_data
        - name: output_path
      container:
        name: main
        image: kevinoulai/erctl:bert
        imagePullPolicy: IfNotPresent
        command: [/opt/venv/bin/python, /app/distributions/bert_distribution.py]
        resources:
          limits:
            nvidia.com/gpu: 1
        args:
        - --mode
        - '{{inputs.parameters.mode}}'
        - --processed_data
        - '{{inputs.parameters.processed_data}}'
        - --output
        - '{{inputs.parameters.output_path}}'
        - --function
        - '{{inputs.parameters.function}}'
        env:
        - name: WORKFLOW_NAME
          value: '{{workflow.name}}'
        volumeMounts:
        - name: pipeline-config
          mountPath: /app/config/examples/config-bert.yaml
          subPath: config.yaml
        - name: pipeline-bert-model
          mountPath: /app/data/bert
        - name: bert-distribution
          mountPath: /app/distributions/bert_distribution.py
          subPath: bert_distribution.py
        - name: bert-training
          mountPath: /app/pipeline/bert_training.py
          subPath: bert_training.py
        - name: pipeline-reports
          mountPath: /app/reports
        - name: pipeline-data
          mountPath: /data
        - name: pipeline-io
          mountPath: /app/utils/pipeline_io.py
          subPath: pipeline_io.py
      volumes:
      - name: pipeline-config
        configMap:
          name: er-pipeline-config
      - name: pipeline-bert-model
        persistentVolumeClaim:
          claimName: pipeline-bert-model-claim
      - name: bert-distribution
        configMap:
          name: eaer-bert-distribution
      - name: bert-training
        configMap:
          name: eaer-bert-training
      - name: pipeline-data
        persistentVolumeClaim:
          claimName: pipeline-data-claim
      - name: pipeline-reports
        persistentVolumeClaim:
          claimName: pipeline-reports-claim
      - name: pipeline-io
        configMap:
          name: eaer-pipeline-io
    - name: pipeline-init
      inputs:
        parameters:
        - name: fallback_mode
      container:
        name: main
        image: kevinoulai/erctl:config
        imagePullPolicy: IfNotPresent
        command: [sh, /app/init.sh]
        env:
        - name: FALLBACK_MODE
          value: '{{inputs.parameters.fallback_mode}}'
        volumeMounts:
        - name: pipeline-config
          mountPath: /app/config/examples/config-embedding.yaml
          subPath: config.yaml
        - name: pipeline-init-script
          mountPath: /app/init.sh
          subPath: init.sh
        - name: pipeline-buffer-data
          mountPath: /app/data/buffers
      volumes:
      - name: pipeline-config
        configMap:
          name: er-pipeline-config
      - name: pipeline-init-script
        configMap:
          name: eaer-pipeline-init
      - name: pipeline-buffer-data
        persistentVolumeClaim:
          claimName: pipeline-buffer-data-claim
      outputs:
        parameters:
        - name: mode
          valueFrom:
            path: /tmp/mode
        artifacts:
        - name: config
          path: /tmp/config.yaml

    - name: embedding-training-dag
      inputs:
        parameters:
        - name: mode
      dag:
        tasks:
        - name: normalization
          template: normalization
          arguments:
            parameters:
            - name: raw_data
              value: '{{workflow.parameters.raw_data}}'
            - name: data_source_A
              value: '{{workflow.parameters.data_source_A}}'
            - name: data_source_B
              value: '{{workflow.parameters.data_source_B}}'
            - name: mode
              value: '{{inputs.parameters.mode}}'
            - name: function
              value: normalization
            - name: output_path
              value: /app/data/buffers/{{workflow.name}}/batch/embedding/processed_data.json

        - name: graph-construction
          template: graph
          depends: normalization.Succeeded
          arguments:
            parameters:
            - name: mode
              value: '{{inputs.parameters.mode}}'
            - name: function
              value: graph_construction
            - name: processed_data
              value: /app/data/buffers/{{workflow.name}}/batch/embedding/processed_data.json
            - name: output_path
              value: /app/data/buffers/{{workflow.name}}/batch/embedding/graph.json

        - name: random-walk
          template: graph
          depends: graph-construction.Succeeded
          arguments:
            parameters:
            - name: mode
              value: '{{inputs.parameters.mode}}'
            - name: function
              value: random_walk
            - name: processed_data
              value: ""
            - name: output_path
              value: /app/data/buffers/{{workflow.name}}/batch/embedding/sequences.json

        - name: embedding-training
          template: embedding
          depends: random-walk.Succeeded
          arguments:
            parameters:
            - name: mode
              value: '{{inputs.parameters.mode}}'
            - name: function
              value: embedding_training
            - name: sequences
              value: /app/data/buffers/{{workflow.name}}/batch/embedding/sequences.json
            - name: candidate_pairs
              value: ""
            - name: output_path
              value: /app/data/buffers/{{workflow.name}}/batch/embedding/embedding_training.json

        - name: cg-feature-extraction
          template: cg-feature-extraction
          depends: normalization.Succeeded
          arguments:
            parameters:
            - name: mode
              value: '{{inputs.parameters.mode}}'
            - name: function
              value: cg_feature_extraction
            - name: processed_data
              value: /app/data/buffers/{{workflow.name}}/batch/embedding/processed_data.json
            - name: output_path
              value: /app/data/buffers/{{workflow.name}}/batch/embedding/cg_feature.json

        - name: feature-index-construction
          template: feature-index
          depends: cg-feature-extraction.Succeeded
          arguments:
            parameters:
            - name: mode
              value: '{{inputs.parameters.mode}}'
            - name: function
              value: feature_index_construction
            - name: cg_feature
              value: /app/data/buffers/{{workflow.name}}/batch/embedding/cg_feature.json
            - name: output_path
              value: /app/data/buffers/{{workflow.name}}/batch/embedding/candidate_pairs.json

    - name: main
      dag:
        tasks:
        - name: pipeline-init
          template: pipeline-init
          arguments:
            parameters:
            - name: fallback_mode
              value: '{{workflow.parameters.mode}}'

        - name: embedding-training-dag
          depends: pipeline-init.Succeeded
          when: "'{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*embedding.*' && '{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*training.*'"
          template: embedding-training-dag
          arguments:
            parameters:
            - name: mode
              value: '{{tasks.pipeline-init.outputs.parameters.mode}}'

        - name: bert-normalization-training
          depends: pipeline-init.Succeeded
          when: "'{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*bert.*' && '{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*training.*'"
          template: normalization
          arguments:
            parameters:
            - name: raw_data
              value: '{{workflow.parameters.raw_data}}'
            - name: data_source_A
              value: '{{workflow.parameters.data_source_A}}'
            - name: data_source_B
              value: '{{workflow.parameters.data_source_B}}'
            - name: mode
              value: bert-training
            - name: function
              value: normalization
            - name: output_path
              value: /app/data/buffers/{{workflow.name}}/batch/bert/training_processed_data.json

        - name: bert-training
          depends: bert-normalization-training.Succeeded
          template: bert
          arguments:
            parameters:
            - name: mode
              value: bert-training
            - name: function
              value: bert_training
            - name: processed_data
              value: /app/data/buffers/{{workflow.name}}/batch/bert/training_processed_data.json
            - name: output_path
              value: /app/data/buffers/{{workflow.name}}/batch/bert/training_output.json

        - name: bert-normalization-inference
          depends: "pipeline-init.Succeeded && (bert-training.Succeeded || bert-training.Omitted)"
          when: "'{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*bert.*' && '{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*inference.*'"
          template: normalization
          arguments:
            parameters:
            - name: raw_data
              value: '{{workflow.parameters.raw_data}}'
            - name: data_source_A
              value: '{{workflow.parameters.data_source_A}}'
            - name: data_source_B
              value: '{{workflow.parameters.data_source_B}}'
            - name: mode
              value: bert-inference
            - name: function
              value: normalization
            - name: output_path
              value: /app/data/buffers/{{workflow.name}}/batch/bert/inference_processed_data.json

        - name: bert-inference
          depends: bert-normalization-inference.Succeeded
          template: bert
          arguments:
            parameters:
            - name: mode
              value: bert-inference
            - name: function
              value: bert_inference
            - name: processed_data
              value: /app/data/buffers/{{workflow.name}}/batch/bert/inference_processed_data.json
            - name: output_path
              value: /app/data/buffers/{{workflow.name}}/batch/bert/inference_output.json

        - name: bert-normalization-b-evaluation
          depends: "pipeline-init.Succeeded && (bert-inference.Succeeded || bert-inference.Omitted) && (bert-training.Succeeded || bert-training.Omitted)"
          when: "'{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*bert.*' && '{{tasks.pipeline-init.outputs.parameters.mode}}' =~ '.*b_evaluation.*'"
          template: normalization
          arguments:
            parameters:
            - name: raw_data
              value: '{{workflow.parameters.raw_data}}'
            - name: data_source_A
              value: '{{workflow.parameters.data_source_A}}'
            - name: data_source_B
              value: '{{workflow.parameters.data_source_B}}'
            - name: mode
              value: bert-b_evaluation
            - name: function
              value: normalization
            - name: output_path
              value: /app/data/buffers/{{workflow.name}}/batch/bert/evaluation_processed_data.json

        - name: bert-evaluation
          depends: bert-normalization-b-evaluation.Succeeded
          template: bert
          arguments:
            parameters:
            - name: mode
              value: bert-b_evaluation
            - name: function
              value: bert_evaluation
            - name: processed_data
              value: /app/data/buffers/{{workflow.name}}/batch/bert/evaluation_processed_data.json
            - name: output_path
              value: /app/data/buffers/{{workflow.name}}/batch/bert/evaluation_output.json
