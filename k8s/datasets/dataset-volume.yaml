apiVersion: v1
kind: PersistentVolume
metadata:
  name: eaer-datasets-pv
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: 192.168.1.107
    path: /srv/nfs/k8s/data
    readOnly: true
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pipeline-data-claim
  namespace: argo
spec:
  accessModes:
    - ReadOnlyMany
  storageClassName: ""
  volumeName: eaer-datasets-pv
  resources:
    requests:
      storage: 100Gi
