    protocol: TCP
    port: 5001
    targetPort: 5001
  - name: random-walk
    protocol: TCP
    port: 5002
    targetPort: 5002
  - name: embedding-training
    protocol: TCP
    port: 5003
    targetPort: 5003
  - name: bert-training
    protocol: TCP
    port: 5004
    targetPort: 5004
  - name: cg-feature-extraction
    protocol: TCP
    port: 5005
    targetPort: 5005
  - name: feature-index-construction
    protocol: TCP
    port: 5006
    targetPort: 5006
  - name: candidate-enumeration
    protocol: TCP
    port: 5007
    targetPort: 5007
  - name: calculating-similarity
    protocol: TCP
    port: 5008
    targetPort: 5008
  - name: decision-making
    protocol: TCP
    port: 5009
    targetPort: 5009
  - name: bert-inference
    protocol: TCP
    port: 5010
    targetPort: 5010
  - name: evaluation
    protocol: TCP
    port: 5011
    targetPort: 5011
