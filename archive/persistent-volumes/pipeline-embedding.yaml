apiVersion: v1
kind: PersistentVolume
metadata:
  name: pipeline-embedding
spec:
  capacity:
    storage: 10M
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Recycle
  storageClassName: slow
  mountOptions:
    - hard
    - nfsvers=4.1
  nfs:
    path: /tmp
    server: 172.17.0.2
